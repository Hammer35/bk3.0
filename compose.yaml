name: boostklient3

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: config.settings.development
  POSTGRES_DB: boostklient
  POSTGRES_USER: boostklient
  POSTGRES_PASSWORD: boostklient_dev_only
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  VALKEY_URL: redis://valkey:6379/0
  GIGACHAT_API_TOKEN: ${GIGACHAT_API_TOKEN:-}
  PINTEREST_CLIENT_ID: ${PINTEREST_CLIENT_ID:-}
  PINTEREST_CLIENT_SECRET: ${PINTEREST_CLIENT_SECRET:-}
  PINTEREST_REDIRECT_URI: ${PINTEREST_REDIRECT_URI:-}
  PINTEREST_SCOPES: ${PINTEREST_SCOPES:-user_accounts:read,boards:read,boards:write,pins:read,pins:write}
  PINTEREST_APP_CREATED_BEFORE_2025_09_25: ${PINTEREST_APP_CREATED_BEFORE_2025_09_25:-false}
  PINTEREST_TOKEN_ENCRYPTION_KEY: ${PINTEREST_TOKEN_ENCRYPTION_KEY:-}
  GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2}
  GIGACHAT_MODEL_PRIORITY: ${GIGACHAT_MODEL_PRIORITY:-GigaChat-2,GigaChat-3-Lightning,GigaChat-2-Pro,GigaChat-3-Pro,GigaChat-2-Max,GigaChat-3-Ultra}
  GIGACHAT_AVAILABLE_MODELS_CACHE_SECONDS: ${GIGACHAT_AVAILABLE_MODELS_CACHE_SECONDS:-300}
  GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
  GIGACHAT_EMBEDDING_MODEL: ${GIGACHAT_EMBEDDING_MODEL:-EmbeddingsGigaR}

x-app-service: &app-service
  image: boostklient3:development
  working_dir: /app
  environment: *app-environment
  volumes:
    - .:/app
    - media_data:/app/var/media
  depends_on:
    db:
      condition: service_healthy
    valkey:
      condition: service_healthy

services:
  db:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: boostklient
      POSTGRES_USER: boostklient
      POSTGRES_PASSWORD: boostklient_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boostklient -d boostklient"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.10-alpine
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    <<: *app-service
    build:
      context: .
    command: >
      sh -c "python manage.py migrate &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    <<: *app-service
    command: celery -A config worker -l INFO -Q critical,generation,research,analytics,notifications,low_priority
    restart: unless-stopped

  beat:
    <<: *app-service
    command: celery -A config beat -l INFO --schedule /tmp/celerybeat-schedule
    restart: unless-stopped

volumes:
  postgres_data:
  valkey_data:
  media_data:
