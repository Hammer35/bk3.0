youtube:
  titles:
    - "Отложенная публикация в Pinterest: ставим пин в очередь — урок 39"
    - "Очередь пинов: сколько и на какой срок"
    - "Запланировали пин с ошибкой на картинке? Изменить её уже нельзя"
  thumbs:
    - "Пин по расписанию"
    - "Месяц и десяток"
    - "Картинку не поменять"
  description: |
    Тридцать девятое занятие. Героиня закончила пин сегодня, а опубликовать хочет позже. Бизнес-профиль это позволяет.

    Разбираем:
    • сначала проверка изображения, заголовка, описания, доски и ссылки — планирование не заменяет проверку;
    • выбор момента выхода прямо в форме создания;
    • где увидеть очередь и что внести в учёт;
    • текущие ограничения по горизонту и количеству (уточняйте в справке);
    • какие поля остаются редактируемыми и что заморожено;
    • сторонние планировщики оцениваем отдельно: доступ, функции, стоимость.

    Порядок показан по справке, в профиле ничего не ставили в очередь. Анна сочинена.

    Задание: подготовьте проверенный материал и изучите список запланированных публикаций до создания пина.

    Справка о планировании: https://help.pinterest.com/en/business/article/schedule-pins
