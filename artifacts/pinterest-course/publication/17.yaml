      description: |
        Если фразы описывают одну задачу — свяжите их. Если задачи разные — держите отдельно. Не смешивайте.
      hashtags: [pinterest, shorts, ключевыеслова]
      hook: "Похожи, но не одинаковы"
      cover: "Связать или разделить"

vk_video:
  titles:
