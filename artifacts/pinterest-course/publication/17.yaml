  description: |
    Семнадцатая серия. Вопросы есть — теперь подбираем слова, которыми их описать. Работаем с поиском Pinterest, ведём таблицу и для каждой фразы фиксируем происхождение: увидели в интерфейсе или сочинили сами.

    Предупреждаем: подсказка поиска не равна числу запросов и не обещает продаж. Героиня выдумана, интерфейс снят вживую.

