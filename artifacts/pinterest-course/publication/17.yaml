youtube:
  titles:
    - "Ключевые слова для Pinterest: как собрать формулировки из поиска — урок 17"
    - "Таблица формулировок для пинов: слова, вопрос, материал, источник"
    - "Выпадающая подсказка — не количество запросов. Не путайте"
  thumbs:
    - "Ключевые слова"
    - "4 столбца"
    - "Подсказка ≠ спрос"
  description: |
    Семнадцатое занятие. Собираем слова, которыми можно описать вопросы из прошлого урока, и честно отмечаем, откуда каждое из них взялось.

    Разбираем:
    • почему «разместить вещи» и «выбрать предмет» — два вопроса, и для второго ответа пока нет;
    • выпадающие варианты в строке — а если их нет, свои идеи за них не выдаём;
    • таблицу на четыре колонки;
    • фиксацию того, что вводили и когда;
    • похожие фразы для одного вопроса и разные задачи, которые нельзя смешивать.

    Важно: появление слов в подсказке не говорит ни о числе поисков, ни о покупателях. Анна — персонаж; таблица учебная.

    Задание: дополните список несколькими формулировками и пометьте, что увидели на экране, а что придумали.

    Официально о поиске идей: https://help.pinterest.com/en/article/search-for-ideas-on-pinterest
  hashtags: [Pinterest, КлючевыеСлова, КурсPinterest]
  tags: [ключевые слова pinterest, seo pinterest, поисковые подсказки pinterest, как подобрать слова для пина, семантика pinterest, pinterest для бизнеса, pinterest для начинающих, таблица ключевых слов]
  comment: |
