rutube:
  titles:
    - "Урок 17. Подбор слов для публикаций Pinterest"
    - "Работа с поисковыми подсказками Pinterest и учёт источников"
  covers:
    - "Сбор формулировок"
    - "Учёт источников"
  description: |
    Семнадцатое занятие.

    Темы:
    1. Различение вопросов, требующих разных материалов.
    2. Поисковые подсказки и уточнения как источник формулировок.
    3. Недопустимость приписывать платформе собственные варианты.
    4. Структура рабочей таблицы.
    5. Регистрация введённого запроса и времени просмотра.
    6. Группировка близких формулировок.
    7. Ограничения: подсказка не отражает частоту поиска.

    Учебные формулировки не выдаются за найденные. Персонаж условный.

    Справка: https://help.pinterest.com/en/article/search-for-ideas-on-pinterest
