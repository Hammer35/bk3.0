instagram:
  reels:
    - caption: |
        Pinterest — это не про «полистать красивое». Туда приходят с задачей: «ужин за 20 минут», «капсула на осень», «уголок для работы».

        Пин — единственная мысль в картинке. Доска — папка, где такие мысли лежат вместе.

        Это первый ролик нашего курса. Подписывайтесь, если тоже хотите разобраться без воды.
      trial_caption: |
        Объясняю Pinterest человеку, который там ни разу не был. Две вещи — и вы уже понимаете больше половины пользователей.
      hashtags: [pinterest, пинтерест, маркетинг]
      hook: "Pinterest — не лента картинок"
      cover: "Pinterest за 30 секунд"
    - caption: |
        Человеку понравилась идея на пине → он нажал → попал на статью или товар. Вот путь, ради которого бизнес идёт в Pinterest.

        Но есть нюанс: страница должна совпадать с обещанием. Пин о пяти идеях для стола — значит, по ссылке те самые пять идей, а не главная магазина.

        Пример с Анной учебный, героиню мы придумали.
      trial_caption: |
        Как картинка в Pinterest приводит человека к вам на сайт — и где этот путь чаще всего ломается.
      hashtags: [pinterest, пинтерест, трафик]
      hook: "Как картинка приводит на сайт"
      cover: "От пина до сайта"
  carousel:
    caption: |
      Pinterest на пальцах — сохраните, если только начинаете. Пять карточек, и картина сложится.

      Анну мы выдумали для примеров, зато скриншоты живые.
    hashtags: [pinterest, пинтерест, обучение]
    alt: "Первая карточка: чёрный фон, крупно жёлтым «Pinterest на пальцах: 5 карточек»."
    slides:
