      hashtags: [pinterest, shorts, пин]
      hook: "Пин или доска? Сейчас поймёте"
      cover: "Пин ≠ доска"
    - title: "Куда ведёт ссылка из пина и почему это важно"
      description: |
        Картинка рассказывает о статье — открываться должна статья. Показан товар — его карточка. Перед публикацией откройте адрес сами.
      hashtags: [pinterest, shorts, ссылка]
      hook: "Пин обещал одно, а открылось другое?"
      cover: "Куда ведёт пин"

