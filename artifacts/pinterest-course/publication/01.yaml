threads:
  topic: "Pinterest"
  card: "Здесь на вопросы отвечают фотографиями"
  posts:
    - |
      Хотите понять Pinterest — перестаньте думать о нём как о соцсети.

      Это поисковик, который отвечает картинками. Человек пишет, что хочет уместить кабинет в крохотной комнате, и получает сотни вариантов. #Pinterest
    - |
      Дальше всё держится на трёх вещах.
      Пин — отдельная находка.
      Доска — коллекция находок.
      Ссылка — дорожка с картинки на ваш сайт.

      Сколько человек по ней пройдёт, заранее не скажет никто. И клик — ещё не покупка.
    - |
      Мы запустили обучение для новичков, и стартовое видео посвящено ровно этому. Героиня Анна там сочинённая, экраны — нет.

      Вы уже пользуетесь Pinterest или только присматриваетесь?

