youtube:
  titles:
    - "Что такое Pinterest и как он работает: пины, доски, ссылки — урок 1"
    - "Pinterest за 2 минуты: зачем бизнесу визуальный поисковик"
    - "Pinterest — это не соцсеть. Тогда что это и как туда приходят покупатели?"
  thumbs:
    - "Pinterest с нуля"
    - "Пин → доска → сайт"
    - "Это не соцсеть"
  description: |
    Стартовое занятие бесплатной программы BoostKlient. Объясняем, как устроена площадка, где люди ищут идеи через картинки, и как от понравившейся публикации человек может попасть на ваш сайт.

    Разбираем:
    • поиск идей: как выглядит выдача по бытовой задаче;
    • что такое пин и что такое доска;
    • как блогер или продавец может сделать пин со ссылкой на статью или карточку товара;
    • зачем адрес сверяют заранее.

    Пример построен вокруг Анны — она выдумана для курса: продаёт товары для организации дома и пишет блог. Экраны записаны в реальном учебном аккаунте.

    Важно: заранее никто не знает, сколько будет просмотров и переходов, а клик по ссылке — ещё не покупка.

    Задание: соберите три публикации по своему направлению и допишите фразу «В своём пине я покажу… А по ссылке человек найдёт…».

    Путеводитель от самой платформы по Pinterest: https://help.pinterest.com/en/guide/all-about-pinterest
  hashtags: [Pinterest, ЧтоТакоеPinterest, КурсPinterest]
