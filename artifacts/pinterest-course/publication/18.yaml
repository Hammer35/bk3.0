slug: Где_использовать_выбранные_слова
title: Где использовать выбранные слова

youtube:
  titles:
    - "Куда вставлять ключевые слова в Pinterest: заголовок, описание, доска — урок 18"
    - "SEO для пина без спама: связный текст вместо списка слов"
    - "Описание-перечень слов: почему так не пишут. Разбор"
  thumbs:
    - "Слова в дело"
    - "Без спама"
    - "Список ≠ текст"
  description: |
    Восемнадцатое видео. Подобранные формулировки превращаем в связный текст пина, который помогает понять материал, а не обещает чужой.

    Что внутри:
    • один вопрос и один материал как отправная точка;
    • разбор опубликованного учебного заголовка — в нём названы и задача, и место;
    • правило: обещаете пять способов — покажите пять, показываете один вариант — так и скажите;
    • описание: что человек увидит; сведения о товаре — только проверенные;
    • у учебного пина нет адреса — статьи за ним нет, и мы этого не прячем;
    • почему перечень существительных через запятую ничего не объясняет;
    • соответствие доски и альтернативный текст без ключевых слов.

    Платформа советует вписывать уместные слова в названия пинов и досок, но гарантий охвата это не даёт. Героиня вымышлена.

    Задание: подготовьте заголовок и описание в отдельном документе и сверьте их с картинкой, доской и страницей.
  hashtags: [Pinterest, SEOPinterest, КурсPinterest]
  tags: [ключевые слова в описании пина, seo pinterest, как написать описание для пина, заголовок пина ключевые слова, оптимизация пина, pinterest для бизнеса, переспам ключевыми словами, pinterest для начинающих]
  comment: |
    Скопируйте сюда описание своего пина — подскажем, где слова звучат как список, а где как текст.
  shorts:
    - title: "Список ключевых слов — это не описание пина"
      description: |
        Перечисление не объясняет ничего. Свяжите слова в предложения, которые рассказывают, что на картинке.
      hashtags: [pinterest, shorts, seo]
      hook: "Пять слов через запятую — мимо"
      cover: "Не списком"
    - title: "Один вариант на фото — не обещайте пять"
      description: |
        Красивое обещание не заменяет материал. Если показываете одно решение, так и напишите.
      hashtags: [pinterest, shorts, честность]
      hook: "Обещание больше материала?"
      cover: "Ровно столько, сколько есть"

vk_video:
  titles:
    - "Поисковые слова в пине: текст вместо спама"
    - "Заголовок, описание, доска и alt: где каким словам место"
  covers:
    - "Слова без спама"
    - "Каждому полю — своё"
  description: |
    Восемнадцатая серия. Таблица слов собрана — вписываем их в пин так, чтобы читателю всё стало ясно. Разбираем учебный заголовок, пишем пояснение, проверяем доску и альтернативный текст.

    Отдельно — почему добавленные слова сами по себе ничего не гарантируют. Персонаж придуман, скриншоты живые.

    После урока: напишите текст своего пина в документе и сверьте его с изображением и ссылкой.
  hashtags: [pinterest, пинтерест, тексты]
  post: |
    Видели описания пинов, состоящие из одних существительных? Кажется, так лучше для поиска. Но человеку это ничего не говорит.

    Платформа рекомендует уместную лексику — только в нормальных предложениях. В восемнадцатом уроке показываем как.

    Какое слово вам сложнее всего вписать естественно?
