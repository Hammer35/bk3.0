youtube:
  titles:
    - "Картинка для пина Pinterest: формат 2:3, 1000×1500, кадрирование и надпись — урок 11"
    - "Пин читается на маленьком экране? Проверяем фото, обрезку и текст"
    - "Красивое фото — ещё не хороший пин. Что проверить перед публикацией"
  thumbs:
    - "1000 × 1500"
    - "Видно с телефона?"
    - "Фото ≠ пин"
  description: |
    Одиннадцатое видео. Готовим изображение, которое раскрывает выбранную тему и читается даже на крохотном экране.

    Разбираем по порядку:
    • выбор снимка: видно ли, как расположены вещи и какую задачу решает органайзер;
    • резкий исходник без перекосов; при обрезке сохраняем важные предметы;
    • рекомендованные пропорции обычного пина — 2:3, например холст 1000×1500 пикселей;
    • короткая надпись по теме, которая не закрывает главное;
    • тест уменьшением: читается ли фраза без напряжения;
    • права на изображение и хранение исходника отдельно от оформленной версии.

    Анна, чьё фото используем, — персонаж-выдумка; снимок сделан для курса. Экраны реальные.

    Задание: подготовьте вертикальную картинку, посмотрите её на телефоне и исправьте всё, что мешает понять смысл.

    Правила сообщества Pinterest: https://policy.pinterest.com/en/community-guidelines
