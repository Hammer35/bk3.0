    Двенадцатое видео бесплатной программы. Пишем название и пояснение к публикации — так, чтобы они продолжали изображение и честно описывали материал по ссылке.

    В выпуске:
    • разбор учебного названия про ручки и блокнот;
    • описание, которое добавляет подробности и называет следующий шаг;
