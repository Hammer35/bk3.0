  thumbs:
    - "Ссылка ≠ подтверждение"
    - "Три способа claim"
    - "Две разные настройки"
  description: |
    Девятый урок. Разводим две задачи, которые постоянно путают: показать адрес сайта посетителю и доказать Pinterest, что сайтом управляете вы.

    Содержание:
    • где вписать адрес для гостей — программировать не придётся;
    • подтверждение: Pinterest проверяет владение и даёт связать материалы сайта с профилем;
    • три официальных варианта: метатег, загружаемый файл, DNS;
    • почему с Etsy, eBay и Amazon так не выйдет;
    • что делать, если сайтом занимается другой человек.

    В учебном аккаунте поле сайта пустое — подтверждение мы только показываем, не выполняем. Анна и её блог — вымысел.

    Задание: проверьте поле «Веб-сайт»; если сайт есть — выясните, кто и каким способом поможет с подтверждением.

    Инструкция Pinterest: https://help.pinterest.com/en/business/article/claim-your-website
