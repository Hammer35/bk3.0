  post: |
    Открыли Pinterest Trends, видите пик со значением 100 и радуетесь: «Сто запросов!» Увы, нет.

    100 — это вершина интереса внутри выбранного периода. Относительная отметка, не штуки и не люди.

    В девятнадцатом уроке учимся читать такие графики правильно. Пользовались уже трендами?
