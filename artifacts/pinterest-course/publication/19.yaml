    - "США — не Россия"
  description: |
    Девятнадцатое занятие. Открываем Pinterest Trends — инструмент истории поискового интереса — и учимся читать линию трезво.

    Внутри:
    • выбор региона и почему его обязательно записывать (данные по США не переносим на Россию без проверки);
    • поисковые тренды и выбор периода;
    • шкала: максимум интереса = 100, это относительный показатель, а не сто запросов или людей;
    • чтение линии: подъём, пик, спад и даты на оси;
    • что фиксировать после просмотра;
    • пустой график — пробел в источнике, а не равнодушие людей.

    Анна — придуманная героиня, график показан для учебной темы. Причины изменений линия не объясняет, а переходы и покупки по ней не предсказать.

    Задание: одна запись из четырёх частей по доступному графику.

    О сервисе: https://help.pinterest.com/en/business/article/pinterest-trends
  hashtags: [PinterestTrends, Pinterest, КурсPinterest]
