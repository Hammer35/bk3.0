    Девятнадцатый выпуск. Знакомимся с Pinterest Trends: выбираем регион, период, тему и учимся описывать линию, не придумывая лишнего.

    Главные ловушки: путать относительную шкалу с количеством, применять зарубежную картину к своей аудитории и объяснять пики без проверки. Анну мы сочинили; инструмент открыт вживую.

