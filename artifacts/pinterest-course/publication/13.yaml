  description: |
    Тринадцатое видео бесплатного цикла. Учимся описывать само изображение для незрячих и слабовидящих, которые слушают экран.

    Внутри:
    • где спрятано поле alt (раздел дополнительных параметров);
    • пример: что стоит на столе, где именно и какие буквы над фото;
    • чем alt отличается от описания публикации — рекламе здесь не место;
    • сколько знаков допускает поле;
    • проверка: прочитать текст, отвернувшись от картинки, затем сверить с изображением.

    Анна — вымышленная героиня курса; её картинка с органайзером учебная. Публиковать пин ради заполнения поля не нужно.

    Задание: опишите главное на своём изображении и передайте текст надписи, если она есть. Не называйте материал предмета, если не знаете его.

    Гид Pinterest: https://help.pinterest.com/en/guide/guide-to-creating-pins
