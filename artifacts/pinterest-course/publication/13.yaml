  description: |
    Тринадцатое занятие программы.

    Вопросы:
    1. Назначение альтернативного текста: описание изображения для программ экранного доступа.
    2. Где найти соответствующее поле.
    3. Структура описания: предметы, их взаимное расположение, текст надписи.
    4. Отличие от описания публикации.
    5. Ограничение по объёму согласно справке Pinterest (500 символов).
    6. Проверка точности формулировок.

    Изображение и персонаж учебные.

