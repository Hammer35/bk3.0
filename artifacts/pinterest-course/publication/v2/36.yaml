    Rich Pins — расширенные публикации, которые автоматически подтягивают данные с вашей страницы. Разбираем, кому это подходит и почему само не включается.

    Урок 36 курса BoostKlient. В справке названы три разновидности. Статья может выводить в пине заголовок, описание и автора, товар — стоимость и наличие на складе. Для этого на сайте нужна разметка — служебные данные в коде страницы, поэтому зовём разработчика. С карточкой маркетплейса иначе: код вам не принадлежит, и сначала выясняем, что позволяет площадка. После настройки сверяем показанные сведения с источником по актуальной инструкции.

    В курсе их не подключали, рабочими не называем. Анна — вымышленная.

    Справка Pinterest о Rich Pins: https://help.pinterest.com/en/business/article/rich-pins
