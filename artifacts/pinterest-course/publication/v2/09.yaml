    Как подтвердить сайт на Пинтерест, и почему адрес в шапке — ещё не подтверждение: разводим две настройки, которые путают почти все.

    Девятый урок бесплатного цикла BoostKlient. Поле «Веб-сайт» заполняется в редактировании профиля без всякого кода. Подтверждение — проверка, что сайтом управляете вы: метатег в коде страницы, файл на сайте или запись в DNS. С чужими площадками вроде Etsy так обычно не выйдет — там нет нужного доступа. Своим сайтом занимается программист? Перешлите ему справку.

    В учебном аккаунте поле сайта пустое — подтверждение мы показываем, но не выполняем. Анна и её блог — вымысел.

