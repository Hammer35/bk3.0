  description: |
    Анализ пинов начинается с вопроса: что именно сравниваем и в одинаковых ли условиях. Учимся сопоставлять пару публикаций по одинаковым правилам.

    Урок 30 курса BoostKlient. Берём один и тот же показатель для обоих пинов и не подменяем сохранения кликами. Отрезок отчёта должен начинаться после выхода и быть равной длины. Показы — это возможность получить действие: при большой разнице в показах сравнивать только итоговые сохранения мало. Разница в отчёте — наблюдение, а версия о её причине — предположение. На реальном экране — нулевые карточки и несостыкованные даты; объяснения нулей в уроке нет, и это честно.

    Экраны реальные, героиня сочинена.

    Справка: https://help.pinterest.com/en/business/article/pinterest-analytics
