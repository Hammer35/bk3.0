    Продажи через Пинтерест нельзя увидеть в одной цифре: после клика человек уходит с платформы, и что было дальше, знают другие системы.

    Урок 35 курса BoostKlient. Исходящие клики в аналитике Pinterest показывают переходы за пределы платформы — и только. Сначала формулируем цель: чтение для статьи, обращение для услуги, знакомство или заказ для товара. Проходим маршрут глазами посетителя. Как настроить подсчёт на собственном ресурсе, решаем вместе с тем, кто его ведёт. Для маркетплейса вроде Wildberries сначала читаем, какие отчёты он даёт и что в них называет переходом и заказом: связь заказа с переходом из Pinterest нужно подтверждать отдельно. Источники держим порознь и разбираемся, как каждый считает.

    Никаких обещаний продаж. Героиня — плод фантазии.

    Справка Pinterest Analytics: https://help.pinterest.com/en/business/article/pinterest-analytics
