  description: |
    Альтернативный текст в Пинтерест — описание изображения для людей, которые слушают экран. Показываем, где поле alt и что в него писать.

    Тринадцатый урок курса BoostKlient. Поле спрятано в дополнительных параметрах формы пина. Пишем, что стоит на столе, где именно и какие буквы над фото; рекламу и приглашения в статью оставляем описанию. По справке в поле помещается до 500 символов. Проверка: прочитать, отвернувшись от картинки, потом сверить.

    Анна — вымышленная героиня курса; её картинка с органайзером учебная. Публиковать пин ради заполнения поля не нужно.

    Гид Pinterest: https://help.pinterest.com/en/guide/guide-to-creating-pins
