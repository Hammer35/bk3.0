  titles:
    - "Пин не работает: как разобрать слабый результат в Pinterest — урок 31"
    - "Что провисает — охват, сохранения, клики? Своя проверка для каждого"
    - "Старый пин уже не принесёт показов? Pinterest говорит иначе"
  thumbs:
    - "Слабый пин"
    - "Какой показатель?"
    - "Пины живут долго"
  description: |
    Тридцать первое занятие. «У пина слабый результат» — слишком общая фраза. Учимся уточнять проблему и проверять соответствующий путь.

    По шагам:
    • уточняем, что именно провисает, — и открываем нужный экран;
    • период и фильтры; у пина героини за выбранный период в карточках нули — это описание отчёта, а не объяснение;
    • стыкуем отрезок отчёта с датой выхода;
    • вопрос о переходах — проверяем адрес назначения и не объявляем ссылку рабочей без проверки;
    • сопоставляем изображение, заголовок и описание со страницей; сначала записываем конкретную неисправность;
    • сколько «живёт» публикация по словам самой платформы.

    Учебный аккаунт; героиня придумана.

    Задание: один пин — показатель, значение, период, фильтры; проверка пути; исправление подтверждённой ошибки или одно предположение для проверки на новых данных.

    Справка: https://help.pinterest.com/en/business/article/pin-performance-and-distribution
