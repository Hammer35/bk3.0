  description: |
    Восьмое занятие. Подборка «Рабочее место дома» растёт: лампы, столы, органайзеры, провода. Учимся группировать материалы разделами, не ломая общую тему.

    По шагам:
    • в чём разница между доской (тема) и разделом (часть темы);
    • как придумать имена группам (в примере — свет и мелочи на столе);
    • как добавить раздел внутрь выбранной доски;
    • перемещение публикации через её правку или общий органайзер доски;
    • в каких случаях группировать рано.

    Анну мы сочинили, экраны записаны в учебном профиле. В уроке оцениваем удобство подборки — на охват разделы мы не проверяли.

    Домашнее задание: выберите доску, создайте один раздел с ясным названием и переместите в него подходящий пин.

    Инструкция Pinterest: https://help.pinterest.com/en/article/create-a-board-section
