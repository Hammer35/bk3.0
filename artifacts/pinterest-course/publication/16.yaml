    Шестнадцатое видео — начало модуля о поиске тем. Превращаем общую нишу проекта в конкретный вопрос, на который отвечает один пин.

    В выпуске:
    • из «организации дома» выделяем узкую задачу — порядок на небольшом письменном столе;
    • общий поиск Pinterest против поиска по своим сохранённым пинам;
    • уточнения рядом со строкой и свои слова, если подсказок нет;
    • учебный путь запросов (это наши формулировки, их популярность не измеряли);
    • вопрос, на который отвечает каждый найденный результат;
    • сверка вопросов с тем, что у вас уже есть для ответа.

    Анна — сочинённая героиня. Поиск снят в живом аккаунте.

    Задание: три конкретных вопроса внутри своей темы, к каждому — что покажете и чем подкрепите. Отметьте готовое и недостающее.
