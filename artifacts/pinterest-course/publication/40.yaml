youtube:
  titles:
    - "Нейросети для пинов: как писать заголовки с ИИ и проверять факты — урок 40"
    - "Запрос к нейросети: границы, контекст и проверка"
    - "Нейросеть насчитала семь идей вместо пяти. Кто виноват"
  thumbs:
    - "ИИ для пинов"
    - "Хороший промпт"
    - "Проверяйте ИИ"
  description: |
    Сороковое занятие. Героиня пишет статью о рабочем столе и хочет варианты заголовка от нейросети. Разбираем, как не потерять контроль.

    Внутри:
    • как ставить задачу нейросети с контекстом и рамками;
    • ответ всё равно может ошибаться: сверяем каждую фразу с исходником (пять советов — не «семь идей»);
    • согласованность с картинкой и сайтом, без кликбейта;
    • лицензия сервиса и судьба ваших данных;
    • список проверок: факты подтверждены, выдумки удалены, заголовок совпадает с картинкой и ссылкой;
    • нейросеть даёт формулировки, ответственность остаётся за автором.

    Героиня вымышлена, сервисы в уроке не оплачивались.

    Правила сообщества Pinterest: https://policy.pinterest.com/en/community-guidelines
