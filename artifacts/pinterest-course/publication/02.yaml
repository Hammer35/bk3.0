  covers:
    - "Поиск и рекомендации"
    - "Лента против поиска"
  description: |
    Второе занятие программы.

    Рассматриваемые темы:
    1. Строка поиска и последовательное уточнение запроса.
    2. Уточнения и фильтры, предлагаемые интерфейсом.
    3. Различие задач поиска и главной ленты.
    4. Персональный характер ленты: учёт сохранений, запросов, просмотров и подписок.
    5. Визуальный поиск по изображению и объекту.
    6. Анализ найденной публикации: задача, польза, продолжение по ссылке.

    Показ ведётся в тренировочном профиле; Анна — персонаж. Формулировки запросов являются примерами, их популярность не измерялась.

    Справочный материал: https://help.pinterest.com/en/article/search-for-ideas-on-pinterest
  tags: [pinterest, поиск, рекомендации, обучение, маркетинг, визуальный поиск]

