youtube:
  titles:
    - "Поиск в Pinterest и лента рекомендаций: как найти идеи для своего проекта — урок 2"
    - "Как искать в Pinterest точнее: уточнения, фильтры и визуальный поиск"
    - "Ваша лента в Pinterest врёт о спросе. Почему по ней нельзя судить о теме"
  thumbs:
    - "Ищем, а не листаем"
    - "Лента ≠ спрос"
    - "Уточни запрос"
  description: |
    Второе занятие. Учимся находить идеи под свою нишу и разбираемся, чем поиск отличается от главной ленты.

    Что внутри:
    • строка поиска и пошаговое сужение до конкретной задачи;
    • подсказки-уточнения и фильтры (набор зависит от устройства);
    • почему личная лента показывает подборку для одного аккаунта, а не интересы всех пользователей;
    • визуальный поиск по картинке или выделенному объекту;
    • как смотреть на найденный пин: какую задачу он решает и что по ссылке.

    Пример — Анна, придуманная нами героиня, которая обустраивает маленький стол. Экраны — из настоящего учебного аккаунта.

    Задание: три формулировки на одну тему → три вопроса, которые раскрывают найденные пины → один вопрос для вашей публикации. Популярность запросов в уроке не измерялась.

    Справка Pinterest о поиске: https://help.pinterest.com/en/article/search-for-ideas-on-pinterest
  hashtags: [Pinterest, ПоискPinterest, КурсPinterest]
  tags: [поиск в pinterest, как искать в пинтерест, лента pinterest, рекомендации pinterest, визуальный поиск pinterest, фильтры поиска pinterest, pinterest для начинающих, идеи для бизнеса pinterest, pinterest lens]
  comment: |
