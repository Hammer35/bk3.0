rutube_shorts:
- title: Секундомер на одну публикацию
  description: 'Засеките всё: вопрос, кадр, тексты, проверку адреса и доработку исходника. Реальное время — основа графика.'
- title: 'Две строки календаря: работа и выход'
  description: Подготовка — набор конкретных задач, публикация — их итог. Дату выхода ставим после оценки оставшейся работы.
goals:
- Оценить, сколько времени занимает подготовка одного пина целиком.
- Составить график, где подготовка отделена от даты выхода.
- Сверять план с фактом и переносить даты без пропуска проверок.
quiz:
- q: Что советует справка Pinterest о регулярности?
  options:
  - Создавать оригинальный контент регулярно, ориентир — каждую неделю
  - Публиковать 50 пинов в день
  - Публиковать только по понедельникам
  answer: 1
  why: Совет платформы, без гарантий показов.
- q: Как оценить свой объём работы?
  options:
  - Подготовить один пин целиком и засечь время
  - Взять цифру из чужого блога
  - Публиковать, пока не надоест
  answer: 1
  why: План строится на фактических затратах.
- q: Не успеваете к дате. Что делать?
  options:
  - Перенести дату, не пропуская проверки
  - Опубликовать без проверки
  - Скопировать старый пин
  answer: 1
  why: Количество нельзя наращивать за счёт качества.
- q: Почему «опубликовать во вторник» — плохая запись в плане?
  options:
  - Она не называет оставшуюся работу
  - Вторник — плохой день
  - Её нельзя прочитать
  answer: 1
  why: Подготовку расписывают отдельными задачами.
