rutube_shorts:
- title: 'Адрес сайта в профиле: где он вводится'
  description: В настройках профиля есть строка для веб-адреса. У нас она пустая, потому что сайта у учебного проекта нет. Свой сайт — вписывайте страницу для гостей.
- title: 'Связать домен с профилем: какие есть варианты'
  description: Метка в коде, файл на сервере или запись у регистратора — по официальной инструкции. Выбор зависит от того, к чему у вас есть доступ.
goals:
- Различать адрес сайта в профиле и подтверждение сайта.
- Добавить ссылку в поле «Веб-сайт».
- Назвать три официальных способа подтверждения и понять, какой вам доступен.
quiz:
- q: Что нужно, чтобы просто указать сайт в профиле?
  options:
  - Вписать адрес в поле «Веб-сайт»
  - Доступ к коду сайта
  - Платный аккаунт
  answer: 1
  why: Для ссылки доступ к коду не нужен.
- q: Зачем подтверждать сайт?
  options:
  - Pinterest проверяет, что сайтом управляете вы, и даёт связать материалы с профилем
  - Чтобы поднять пины в поиске
  - Чтобы скрыть профиль
  answer: 1
  why: Подтверждение — отдельная настройка с дополнительными данными.
- q: Какие способы подтверждения описаны в инструкции?
  options:
  - Строка в коде, файл на сайте, запись в настройках домена
  - Звонок в поддержку
  - Фото паспорта
  answer: 1
  why: Выбор зависит от вашего доступа к сайту.
- q: Почему поле сайта в учебном аккаунте пустое?
  options:
  - Сайт для курса не подключали
  - Это ошибка
  - Pinterest запрещает ссылки
  answer: 1
  why: В уроке прямо сказано, что поле оставлено как есть.
