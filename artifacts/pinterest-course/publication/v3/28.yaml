rutube_shorts:
- title: Даты отчёта в аналитике Пинтерест
  description: 'Нужен бизнес-аккаунт. Выбираем отрезок и сразу записываем точные числа: завтра «последние 30 дней» будут уже другими.'
- title: 'Фильтры обзора: меняем по одному'
  description: Тип публикаций, формат, устройство. Для первого разбора оставьте все устройства и выберите нужный формат.
goals:
- Открыть обзор аналитики в бизнес-аккаунте.
- Задать период и записать его точные границы.
- Записывать цифру вместе с условиями отчёта, меняя за раз одну настройку.
quiz:
- q: Где находится обзор аналитики?
  options:
  - 'В меню Pinterest: аналитика → обзор, в бизнес-аккаунте'
  - В редактировании профиля
  - В поиске
  answer: 1
  why: Без бизнес-аккаунта аналитика недоступна.
- q: Почему нужно записывать точные даты периода?
  options:
  - При следующем просмотре «последние 30 дней» сдвинутся
  - Так требует Pinterest
  - Для красоты
  answer: 1
  why: Иначе сравнение будет некорректным.
- q: Зачем менять фильтры по одному?
  options:
  - Чтобы понимать, что именно изменило цифру
  - Чтобы быстрее закончить
  - Так нельзя
  answer: 1
  why: При нескольких изменениях сразу причину не отделить.
- q: В отчёте пусто или ноль. Что записать?
  options:
  - Так и записать, как есть
  - Придумать примерное значение
  - Ничего
  answer: 1
  why: Свежие данные могут пересчитать — фиксируем увиденное.
