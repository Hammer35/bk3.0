rutube_shorts:
- title: Запланировать публикацию на потом
  description: Вычитываем всё заранее, в форме создания выбираем отложенный выход, дату и время. Показано по справке, без реальной очереди.
  cover: Пин на потом
- title: Что поправить в очереди можно, а что нельзя
  description: Дату, тексты, доску и адрес — можно. Файл изображения или ролика — нет. Значит, проверяем его до постановки.
  cover: Что можно поменять
goals:
- Проверить пин полностью до постановки в очередь.
- Запланировать публикацию на дату и время в форме создания.
- Знать, какие поля можно менять после планирования, а какие нет.
quiz:
- q: Заменяет ли планирование проверку пина?
  options:
  - Нет, оно только переносит время выхода
  - Да
  - Да, Pinterest проверит сам
  answer: 1
  why: Ошибка выйдет в выбранный день.
- q: Что нельзя изменить в запланированном пине?
  options:
  - Изображение или видео
  - Дату
  - Заголовок
  answer: 1
  why: По справке менять можно дату, заголовок, доску, описание и ссылку.
- q: Где искать запланированный пин?
  options:
  - Среди запланированных публикаций в профиле
  - В аналитике
  - В поиске
  answer: 1
  why: Анна записывает дату и состояние в таблицу.
- q: Создавалась ли публикация в учебном аккаунте?
  options:
  - Нет, порядок показан на справочном примере
  - Да
  - Да, десять штук
  answer: 1
  why: Так оговорено в уроке.
