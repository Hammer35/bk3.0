rutube_shorts:
- title: 'Разделы в доске Пинтерест: зачем и как'
  description: Когда внутри темы появляются группы, их удобно развести. В примере внутри рабочего места появляется подпапка про освещение.
- title: Переносим публикацию в нужный раздел
  description: Выбираем карточку, команду перемещения и подпапку, сохраняем. Потом заходим внутрь и убеждаемся, что всё на месте.
goals:
- Объяснить, чем раздел отличается от доски.
- Разбить подборку на 2 группы внутри общей темы.
- Создать раздел и перенести в него подходящий пин.
quiz:
- q: Для чего нужен раздел внутри доски?
  options:
  - Чтобы выделить часть темы доски
  - Чтобы создать второй профиль
  - Чтобы скрыть доску от всех
  answer: 1
  why: Доска объединяет тему, раздел выделяет её часть — например, освещение.
- q: Какой пин подходит в раздел «Освещение»?
  options:
  - Идея с настольной лампой
  - Рецепт пирога
  - Фото одежды
  answer: 1
  why: Лампа относится к освещению рабочего места.
- q: Как переместить пин в раздел?
  options:
  - Через редактирование пина или инструменты доски, затем сохранить
  - Удалить и загрузить заново
  - Никак
  answer: 1
  why: После переноса откройте раздел и проверьте результат.
- q: Когда разделы особенно полезны?
  options:
  - Когда на доске накопилось много разных материалов
  - Когда на доске один пин
  - Всегда, с первого дня
  answer: 1
  why: Пока подборка маленькая, нужную идею найти легко.
