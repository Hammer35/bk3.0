rutube_shorts:
- title: 'Шкала Pinterest Trends: от 0 до 100'
  description: Сто — это пик именно этой линии, не количество поисков. Все остальные значения считаются относительно него.
- title: Читаем линию тренда слева направо
  description: Где подъём, где вершина, где спад — и какие даты под ними. Фиксируем увиденное, без догадок о причинах.
goals:
- Открыть Pinterest Trends и выбрать регион и период.
- 'Прочитать график: подъём, пик и спад, с датами.'
- Понимать, что значение 100 — относительная величина.
quiz:
- q: Что значит 100 на графике Pinterest Trends?
  options:
  - Самую высокую точку интереса на этой линии
  - Сто запросов
  - Сто покупателей
  answer: 1
  why: Остальные значения считаются относительно вершины.
- q: Нужного региона нет в списке. Можно ли переносить выводы по США на российскую аудиторию?
  options:
  - Нет, без отдельной проверки нельзя
  - Да, всегда
  - Да, если график красивый
  answer: 1
  why: Регион обязательно записываем.
- q: Что записывать при чтении графика?
  options:
  - Участки роста, вершину и снижение вместе с датами
  - Только максимальное число
  - Причины изменений
  answer: 1
  why: Фиксируем видимое, без догадок.
- q: С чего лучше начать?
  options:
  - С одной темы
  - Сразу с десяти тем
  - С рекламного кабинета
  answer: 1
  why: Так проще понять, что показывает линия.
