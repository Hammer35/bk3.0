rutube_shorts:
- title: 'Новая доска в Пинтерест: открытая или секретная'
  description: Создаём подборку из профиля и сразу решаем, кому она видна. Расположение кнопок зависит от устройства — ищите по смыслу.
- title: 'Первая доска: начните с того, что уже есть'
  description: Не плодите пустые папки. Возьмите задачу, под которую есть хотя бы три своих материала, — лампа, провода, блокнот.
goals:
- Выбрать тему доски по уже имеющимся материалам.
- Придумать название доски, понятное новому посетителю.
- Создать доску и выбрать открытую или секретную видимость.
- Проверять каждый сохраняемый пин на соответствие теме.
quiz:
- q: Какое название доски понятнее?
  options:
  - «Рабочее место дома»
  - «Красивое»
  - «Доска 1»
  answer: 1
  why: Оно сразу объясняет, что внутри.
- q: Что решить до создания доски?
  options:
  - Будет она открытой или секретной
  - Сколько у неё будет подписчиков
  - Какой у неё будет хэштег
  answer: 1
  why: Настройку секретности проверяют перед созданием.
- q: Пин трудно связать с темой доски. Что делать?
  options:
  - Подумать о другой подборке для него
  - Всё равно сохранить сюда
  - Удалить доску
  answer: 1
  why: Каждый пин на доске должен помогать её теме.
- q: Три пина в упражнении — это…
  options:
  - Правило Pinterest
  - Количество для учебного задания
  - Минимум для рекомендаций
  answer: 2
  why: В уроке это прямо названо условием упражнения.
