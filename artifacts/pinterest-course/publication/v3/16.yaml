rutube_shorts:
- title: Как дойти от ниши до темы одной публикации
  description: 'Учебная цепочка сужения: дом → рабочий угол → хранение на маленькой поверхности. Это упражнение, а не статистика спроса.'
- title: Чем ответить на вопрос зрителя
  description: Одна фотография показывает одно решение. Для подборки или сравнения понадобятся дополнительные материалы — проверьте, есть ли они.
goals:
- Сузить широкую тему проекта до вопроса для одного пина.
- Пользоваться общим поиском и его уточнениями, не путая его с поиском по своим пинам.
- Сопоставить вопрос со своими материалами.
quiz:
- q: Какой вопрос подходит для одного пина?
  options:
  - Размещение ручек и блокнота на столе размером с ноутбук
  - Организация дома
  - Всё о хранении
  answer: 1
  why: Здесь понятны и место, и проблема.
- q: Где искать формулировки для темы?
  options:
  - В общем поиске Pinterest
  - Только среди своих сохранённых пинов
  - В настройках профиля
  answer: 1
  why: Поиск по своим пинам показывает только ваше.
- q: Запросы-примеры из урока — это…
  options:
  - Учебные примеры, а не найденные популярные подсказки
  - Доказанно популярные запросы
  - Список Pinterest
  answer: 1
  why: Популярность в уроке не измерялась.
- q: У вас одно фото одного варианта. Что можно честно показать?
  options:
  - Один вариант решения
  - Подборку из десяти решений
  - Сравнение органайзеров
  answer: 1
  why: Для подборки нужны дополнительные материалы.
