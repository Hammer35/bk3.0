rutube_shorts:
- title: Готовить сезонную публикацию заранее
  description: Снимки, текст, проверка адреса, оформление — у каждого шага свой срок. История интереса подсказывает, но дату выхода не назначает.
- title: 'Прогноз Pinterest Predicts: как к нему относиться'
  description: Это годовой выпуск ожиданий самой платформы. Проверьте год и описание направления — и помните, что прогноз не гарантирует результат.
goals:
- Отличать наблюдение по графику, прогноз платформы и собственный план.
- Проверять сезонность по нескольким годам, если данные есть.
- Распланировать подготовку сезонного материала по шагам.
quiz:
- q: Что такое сезонность?
  options:
  - Повторяющиеся изменения интереса, связанные со временем года или событиями
  - Скидки в праздники
  - Обновления Pinterest
  answer: 1
  why: Её проверяют по графикам за разные годы.
- q: На графике один подъём. Доказывает ли он ежегодное повторение?
  options:
  - Нет
  - Да
  - Да, если подъём большой
  answer: 1
  why: Нужно сравнить похожие месяцы разных лет.
- q: Что такое Pinterest Predicts?
  options:
  - Ежегодный прогноз направлений интереса от платформы
  - Гарантия роста показов
  - Сервис рекламы
  answer: 1
  why: Это прогноз, а не обещание результата.
- q: Когда начинать подготовку сезонного материала?
  options:
  - Заранее, учитывая сроки всех шагов
  - В день пика
  - После пика
  answer: 1
  why: Не ждите вершины графика.
