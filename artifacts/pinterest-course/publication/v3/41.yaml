goals:
- Разложить первый месяц работы в Pinterest на четыре недели.
- Задать каждой задаче срок и признак готовности.
- Строить план освоения процесса, не обещая показов и продаж.
quiz:
- q: Что делать в первую неделю?
  options:
  - Проверить аккаунт, профиль, ссылку, доски и собрать материалы с известным источником
  - Опубликовать 30 пинов
  - Запустить рекламу
  answer: 1
  why: Сначала готовится основа.
- q: Зачем в третью неделю отмечать, что отнимает больше времени?
  options:
  - Чтобы следующий план был реалистичнее
  - Чтобы отчитаться перед Pinterest
  - Незачем
  answer: 1
  why: Фактические затраты помогают планировать.
- q: Данных в аналитике через месяц мало. Как это понимать?
  options:
  - 'Это тоже результат проверки: продолжаем сбор без поспешных выводов'
  - Курс не сработал
  - Нужно удалить аккаунт
  answer: 1
  why: Выводы делают, когда цифры их подтверждают.
- q: Какая формулировка задачи лучше?
  options:
  - «Ссылка открывает нужную статью»
  - «Сделать много пинов»
  - «Раскрутиться»
  answer: 1
  why: По ней видно, когда задача выполнена.
rutube_shorts:
- title: 'Месяц в Пинтерест: первые две недели'
  description: Вначале чиним шапку, адрес, подборки и снимки, потом одна карточка проходит весь путь. Пригодится, если ведёте блог и торгуете одновременно.
  cover: Первые две недели
- title: Как понять, что задача в плане выполнена
  description: Неделя четыре — разбор цифр, но только по выбранному периоду и одному показателю. Каждой строке плана нужен срок и видимый результат.
  cover: Срок и результат
