rutube_shorts:
- title: Как ставить задачу нейросети для пина
  description: Ограничьте источник одной статьёй, попросите три коротких варианта и запретите выдумывать числа. Результат перечитываем сами.
- title: Проверяем черновик, написанный машиной
  description: Факты сверены с исходником, придуманное убрано, заголовок соответствует картинке и сайту. Сомнение — правим сами.
goals:
- Составить запрос к нейросети с контекстом и рамками.
- Сверять каждую фразу ответа с исходником.
- Проверять условия сервиса и оставлять ответственность за публикацию за собой.
quiz:
- q: Что делает запрос к ИИ хорошим?
  options:
  - 'Контекст и границы: только сведения из статьи, без лишних цифр и обещаний'
  - Слово «пожалуйста»
  - Длина больше 1000 символов
  answer: 1
  why: Так меньше придётся исправлять.
- q: В статье пять советов, ИИ написал «семь идей». Что делать?
  options:
  - Исправить заголовок
  - Оставить
  - Дописать в статью ещё два совета наугад
  answer: 1
  why: Каждую фразу сверяют с исходником.
- q: Что проверить перед использованием стороннего сервиса?
  options:
  - Его условия и что он делает с вашими текстами
  - Цвет интерфейса
  - Число пользователей
  answer: 1
  why: Условия сервиса изучают заранее.
- q: Кто отвечает за опубликованный текст?
  options:
  - Автор
  - Нейросеть
  - Pinterest
  answer: 1
  why: ИИ даёт черновик, решение остаётся за автором.
