rutube_shorts:
- title: Из чего состоит одна публикация в Пинтерест
  description: Картинка или ролик, название, пара строк пояснения и, при желании, адрес продолжения. Рядом — тематическая подборка, где такие карточки живут.
- title: 'Своё фото или чужая находка: кто автор'
  description: Опубликовать собственный снимок и отложить понравившуюся чужую идею — разные действия. Второе не передаёт вам авторство.
goals:
- Различать профиль, доску и пин на экране.
- Объяснить разницу между созданием своего пина и сохранением чужого.
- Подобрать пару «тема доски — идея пина» для своего проекта.
quiz:
- q: Где посетитель видит имя автора, описание и все его подборки?
  options:
  - В профиле
  - Внутри одного пина
  - В строке поиска
  answer: 1
  why: Профиль — страница аккаунта, через неё знакомятся с автором.
- q: Анна сохранила на свою доску чужую фотографию. Кто её автор?
  options:
  - Анна
  - Тот, кто сделал снимок
  - Pinterest
  answer: 2
  why: Сохранение добавляет публикацию в подборку, но авторство не переходит.
- q: Что объединяет пины на одной доске?
  options:
  - Общая тема
  - Одинаковый размер
  - Дата публикации
  answer: 1
  why: Доска — тематическая подборка, например «Рабочее место дома».
- q: Какая пара подходит для задания урока?
  options:
  - Подборка о месте для работы дома и пин о том, где держать органайзер
  - Доска «Разное» и любой пин
  - Доска без названия и пин без темы
  answer: 1
  why: Идея пина должна быть понятно связана с темой доски.
