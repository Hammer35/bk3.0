  cover: Профиль глазами гостя
- title: Что делать после проверки аккаунта
  description: Записать адреса и даты публикаций, в отчёте — период и метрику, а из найденного выбрать одно ближайшее дело. Финал курса.
  cover: Один следующий шаг
