goals:
- Оценить свой профиль глазами нового посетителя.
- Проверить, что пины ведут туда, куда обещают, и согласованы по теме.
- Выбрать и записать один следующий шаг с понятным результатом.
quiz:
- q: С чего начинается итоговая проверка?
  options:
  - С того, как профиль воспринимает новый человек
  - С рекламного кабинета
  - С удаления старых пинов
  answer: 1
  why: Имя, описание, изображение и ссылка должны объяснять, кто вы.
- q: Что сравнивают, открывая пин?
  options:
  - Текст на пине и открывшуюся по ссылке страницу
  - Число лайков с подписчиками
  - Цвет пина с логотипом
  answer: 1
  why: Продолжение должно соответствовать обещанию.
- q: В пине есть партнёрская ссылка. Что проверить?
  options:
  - Требования к раскрытию и правила программы
  - Ничего
  - Только цвет кнопки
  answer: 1
  why: Коммерческую связь раскрывают.
- q: Сколько шагов выбрать после проверки?
  options:
  - Один, с понятным результатом
  - Все сразу
  - Ни одного
  answer: 1
  why: Начинают с одной задачи.
