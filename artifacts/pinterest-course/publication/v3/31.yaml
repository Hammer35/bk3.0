rutube_shorts:
- title: Нули в отчёте — ещё не диагноз
  description: Сначала проверяем, какие даты и фильтры выбраны и когда вышла публикация. По совсем свежей карточке выводы делать рано.
- title: Сколько живёт публикация в Пинтерест
  description: По словам Pinterest, с публикацией взаимодействуют через месяцы и даже годы. Старость публикации — не объяснение слабых цифр.
goals:
- Назвать конкретный показатель, который вызывает беспокойство.
- Проверить период, фильтры и дату выхода до выводов.
- Найти подтверждённую ошибку в пути человека или записать одно предположение.
quiz:
- q: С чего начать разбор «слабого» пина?
  options:
  - Уточнить, какой показатель беспокоит
  - Переделать всё сразу
  - Удалить пин
  answer: 1
  why: Для каждого вопроса — свой экран статистики.
- q: В карточках нули. Что это?
  options:
  - Описание отчёта, а не объяснение
  - Доказательство плохого пина
  - Ошибка Pinterest
  answer: 1
  why: Причину нужно искать отдельно.
- q: Проблема с переходами. Что проверить?
  options:
  - Открывается ли адрес назначения и совпадает ли с обещанием пина
  - Цвет картинки
  - Число подписчиков
  answer: 1
  why: Ссылку не называют рабочей без проверки.
- q: Пину год. Значит ли это, что взаимодействий больше не будет?
  options:
  - Нет, по словам Pinterest, с пинами взаимодействуют даже через годы
  - Да
  - Да, через месяц пин исчезает
  answer: 1
  why: Давность публикации не объясняет результат.
