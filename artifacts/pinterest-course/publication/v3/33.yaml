rutube_shorts:
- title: Подпись с автором фото — не разрешение
  description: Указанный источник объясняет происхождение снимка. Условия использования ищем отдельно и сохраняем подтверждение.
- title: Четыре ответа до публикации
  description: Кто снял, на каких условиях можно брать, чем подкреплено обещание, куда ведёт адрес. Нет ответа — выясняем.
goals:
- Проверять происхождение изображения и условия его использования.
- Не обещать в заголовке того, что не подтверждено.
- Знать позицию правил Pinterest о нерелевантных словах и искусственной активности.
quiz:
- q: Файл свободно доступен в интернете. Можно ли его использовать?
  options:
  - 'Не обязательно: нужно найти разрешающие условия'
  - Конечно
  - Если подписать автора — да
  answer: 1
  why: Доступность не равна разрешению.
- q: В описании указан автор фото. Это лицензия?
  options:
  - Нет, это только сведения о происхождении
  - Да
  - Да, если есть ссылка
  answer: 1
  why: Подтверждение разрешения сохраняют отдельно.
- q: Что запрещают правила Pinterest?
  options:
  - Нерелевантные ключевые слова и искусственный трафик
  - Длинные описания
  - Вертикальные картинки
  answer: 1
  why: Купленная активность не показывает реального интереса.
- q: Какие обещания нельзя добавлять?
  options:
  - Гарантии, цифры и свойства, которые вы не можете подтвердить
  - Название темы
  - Описание фото
  answer: 1
  why: Обещание должно подтверждаться изображением и страницей.
