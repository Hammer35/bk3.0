rutube_shorts:
- title: 'Имя и аватар профиля: пример для домашнего блога'
  description: Хорошее имя с первого взгляда объясняет, чей это блог и про что. Логотип или портрет проверяем в крошечном кружке — так его видят в ленте.
- title: Сайт в шапке профиля — проверьте сами
  description: Указали адрес — пройдите по нему со смартфона. Если гость не находит обещанное за пару секунд, ссылку лучше поменять.
goals:
- Подобрать название профиля, которое связывает автора с темой.
- Выбрать изображение профиля, узнаваемое в маленьком размере.
- 'Написать описание: чем вы заняты и что публикуете.'
- Проверить ссылку профиля глазами нового посетителя.
quiz:
- q: Какое название лучше для профиля Анны?
  options:
  - «Анна — Порядок дома»
  - «Профиль 2026»
  - «Красивые картинки»
  answer: 1
  why: Оно называет автора и тему.
- q: Как проверить изображение профиля?
  options:
  - Посмотреть, узнаваемо ли оно в маленьком размере
  - Добавить на него мелкий текст
  - Взять любое фото из поиска
  answer: 1
  why: Мелкие детали в кружке аватара не различить.
- q: На какие два вопроса отвечает описание профиля?
  options:
  - Чем вы занимаетесь и какие материалы публикуете
  - Сколько у вас подписчиков и продаж
  - Где вы живёте и сколько вам лет
  answer: 1
  why: Так посетитель понимает, что найдёт в профиле.
- q: Как проверить, понятен ли профиль?
  options:
  - Попросить знакомого объяснить, кто вы и что по ссылке
  - Посмотреть число лайков
  - Никак
  answer: 1
  why: Если ответ не совпал с задумкой, уточняйте формулировки.
