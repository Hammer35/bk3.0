rutube_shorts:
- title: Описать фото для незрячего читателя
  description: Что лежит, где лежит и что написано на фото — без эпитетов и рекламы. Так работает альтернативный текст.
- title: Подпись к пину против описания картинки
  description: Подпись рассказывает о пользе материала, альтернативный текст — только об изображении. Приглашения и обещания во второе поле не пишем.
goals:
- Объяснить, для кого нужен альтернативный текст.
- Перечислить, что изображено, где оно находится и какой текст напечатан на картинке.
- Не переносить в альтернативный текст призывы и обещания.
quiz:
- q: Для кого альтернативный текст?
  options:
  - Для людей, которые пользуются программой чтения с экрана
  - Для поисковых роботов в первую очередь
  - Для подписчиков
  answer: 1
  why: Он помогает представить изображение.
- q: Что входит в альтернативный текст?
  options:
  - Видимые предметы, их расположение и надпись на картинке
  - Приглашение прочитать статью
  - Цена товара
  answer: 1
  why: Пишем о том, что действительно показано.
- q: Где найти поле альтернативного текста?
  options:
  - В дополнительных параметрах формы создания пина
  - В настройках профиля
  - В аналитике
  answer: 1
  why: Так показано в уроке.
- q: Сколько символов допускает поле по справке Pinterest?
  options:
  - До 500
  - До 50
  - Без ограничений
  answer: 1
  why: Для примера Анны хватает нескольких предложений.
