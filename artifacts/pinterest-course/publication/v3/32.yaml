rutube_shorts:
- title: Проверка перехода из пина на сайт
  description: 'Вписываем только проверенный адрес, сверяем страницу с карточкой и проходим по ссылке: открылась ли нужная страница, загрузилось ли содержимое.'
- title: Совпадение пина и страницы — про качество
  description: Справка советует сверять изображение, текст и ключевые слова со страницей назначения. На число показов это не влияет напрямую.
goals:
- Проверить поле ссылки в опубликованном пине.
- Указывать только проверенный адрес и сверять страницу с пином.
- Повторять проверку на телефоне и вести протокол.
quiz:
- q: В учебном пине Анны поле ссылки пустое. Что это значит для других пинов?
  options:
  - 'Ничего: это факт только об этой публикации'
  - У всех пинов нет ссылок
  - Pinterest удалил ссылки
  answer: 1
  why: По одному пину о других не судят.
- q: Что записывать при проверке ссылки?
  options:
  - Устройство, браузер, адрес пина, адрес назначения, результат
  - Только адрес
  - Только дату
  answer: 1
  why: Так проверку легко повторить.
- q: Что советует Pinterest про ссылку?
  options:
  - Сверять адрес и совпадение изображения, текста и ключевых слов со страницей
  - Ставить ссылку на главную
  - Не добавлять ссылки
  answer: 1
  why: Это рекомендация по качеству, а не гарантия охвата.
- q: Ошибка при открытии страницы. Что сделать?
  options:
  - Сохранить точный текст ошибки
  - Сразу объявить сайт сломанным
  - Удалить пин
  answer: 1
  why: Текст ошибки нужен для дальнейшей проверки.
