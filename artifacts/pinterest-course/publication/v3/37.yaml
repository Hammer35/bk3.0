rutube_shorts:
- title: Скрывать партнёрский интерес нельзя
  description: 'Читатель должен понимать, что автору могут заплатить. Плюс условия самой программы: разрешает ли она Pinterest и как обозначать.'
  cover: Партнёрство открыто
- title: Перед коммерческой публикацией
  description: Правила площадки, договор программы, законы страны. Юридическую оценку даёт специалист, а не комментарии.
  cover: Список проверок
goals:
- 'Проверить три уровня условий: правила Pinterest, программы и требования своей страны.'
- Открыто показывать коммерческий интерес автора.
- Оценить партнёрскую публикацию глазами читателя.
quiz:
- q: Чего требуют правила Pinterest для коммерческих публикаций?
  options:
  - 'Прозрачности: читатель понимает, что автор может получить вознаграждение'
  - Скрывать партнёрство
  - Ставить больше хэштегов
  answer: 1
  why: Коммерческий интерес не прячут.
- q: Что проверить в условиях партнёрской программы?
  options:
  - Разрешено ли размещение в Pinterest, нужные обозначения, ограничения
  - Цвет логотипа
  - Количество подписчиков бренда
  answer: 1
  why: Условия разных программ отличаются.
- q: Кто даёт юридическую оценку сотрудничества?
  options:
  - Подходящий специалист
  - Комментаторы
  - Нейросеть
  answer: 1
  why: Курс не заменяет юридическую консультацию.
- q: Запускала ли Анна сотрудничество в уроке?
  options:
  - Нет, публикация только готовится к проверке
  - Да
  - Да, с тремя брендами
  answer: 1
  why: Это учебный разбор.
