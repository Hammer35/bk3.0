rutube_shorts:
- title: 'Название и подпись: учебный пример'
  description: Название формулирует задачу зрителя, подпись — что изображено и что ждёт дальше в блоге. Разбираем на карточке про рабочий стол.
- title: Пообещали в тексте — подтвердите в статье
  description: Если в подписи «пять идей», по ссылке ровно пять, а фото должно показывать именно этот вариант. Сверяем до кнопки.
goals:
- Написать заголовок, который коротко называет тему пина.
- 'Написать описание: что внутри материала и зачем переходить.'
- Проверить, что фото и статья подтверждают обещания текста.
quiz:
- q: Что делает заголовок пина?
  options:
  - Коротко называет тему
  - Перечисляет все хэштеги
  - Сообщает цену
  answer: 1
  why: Подробности добавляет описание.
- q: Когда подходит описание «В блоге — пять идей…»?
  options:
  - Если статья действительно содержит пять идей
  - Всегда
  - Если идей больше трёх
  answer: 1
  why: Анна проверяет оба обещания до публикации.
- q: Какие слова урок советует не использовать?
  options:
  - «Невероятный», «идеальный для всех», «секрет успеха»
  - «Стол», «органайзер»
  - «Блог», «статья»
  answer: 1
  why: Конкретный вопрос объясняет лучше громкого обещания.
- q: Как должны читаться заголовок и описание?
  options:
  - Как одно сообщение
  - Как два разных текста
  - Как список слов
  answer: 1
  why: Они дополняют друг друга.
