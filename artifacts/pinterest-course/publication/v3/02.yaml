rutube_shorts:
- title: 'Поиск в Пинтерест: добавляем слова по одному'
  description: Слишком общий запрос выдаёт всё подряд. Дописываем место и цель — и картинки становятся ближе к нужному. Подсказки помогают, если они есть на вашем экране.
- title: Лента Пинтерест подстраивается под вас
  description: Рекомендации собираются из ваших же действий, поэтому чужого интереса они не отражают. Хотите понять спрос — пользуйтесь поиском.
goals:
- Сузить поисковый запрос от общей темы до конкретной задачи.
- Объяснить, почему собственная лента не показывает интересы всех пользователей.
- Найти похожие идеи через поиск по изображению, если он доступен на устройстве.
- Выбрать один вопрос, на который ответит ваша будущая публикация.
quiz:
- q: Запрос про домашний рабочий угол выдал слишком разные картинки. Что делать?
  options:
  - Добавить к запросу задачу, например хранение на маленьком столе
  - Закрыть поиск и листать ленту
  - Сохранить все результаты подряд
  answer: 1
  why: Уточнение задачи сужает выдачу — так в уроке переходят от темы к конкретному вопросу.
- q: В ленте Анны много рецептов. Что из этого следует?
  options:
  - Идеи для рабочего места никому не нужны
  - Лента подобрана под её прошлые действия и о спросе не говорит
  - Пинтерест показывает только еду
  answer: 2
  why: Личная лента учитывает сохранения, запросы и просмотры одного аккаунта.
- q: Когда пригодится поиск по изображению?
  options:
  - Когда нужную вещь трудно описать словами
  - Когда нужно оплатить рекламу
  - Когда надо удалить пин
  answer: 1
  why: Визуальный поиск ищет похожее по картинке или выбранному объекту.
- q: Формулировки запросов в уроке — это…
  options:
  - Данные о самых популярных поисках
  - Примеры для упражнения, популярность которых не измерялась
  - Официальный список Pinterest
  answer: 2
  why: 'В уроке прямо оговорено: это учебные примеры.'
