rutube_shorts:
- title: Нет готовой статьи — нет ссылки
  description: Выдуманный адрес хуже пустого поля. В нашем примере материал не написан, поэтому публикация остаётся черновиком.
- title: 'Пин вышел: пятиминутная проверка'
  description: Открываем, смотрим изображение и тексты, переходим по адресу. Записываем, где лежит публикация и когда вышла.
goals:
- 'Собрать перед публикацией все части пина: картинку, тексты, альтернативный текст, ссылку.'
- Создать пин в браузере и выбрать подходящую доску.
- Проверить опубликованный пин и записать его адрес и дату.
quiz:
- q: Что должно быть готово до публикации?
  options:
  - Картинка, оба текста и при необходимости проверенный адрес
  - Только картинка
  - Только хэштеги
  answer: 1
  why: Все части готовят заранее, а потом собирают вместе.
- q: Статьи, на которую должен вести пин, ещё нет. Как поступить?
  options:
  - Не придумывать адрес и оставить пин черновиком
  - Вставить любую страницу
  - Вставить главную сайта
  answer: 1
  why: Так поступили в примере Анны.
- q: Что сделать сразу после публикации?
  options:
  - Открыть пин и проверить картинку, тексты и переход
  - Удалить черновик
  - Ничего
  answer: 1
  why: Ошибки лучше найти сразу.
- q: Зачем записывать адрес пина и дату?
  options:
  - Чтобы позже найти его статистику
  - Для Pinterest
  - Чтобы получить скидку
  answer: 1
  why: Это пригодится в уроках об аналитике.
