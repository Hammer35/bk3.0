rutube_shorts:
- title: Почему Pinterest может приостановить профиль
  description: Справка перечисляет нарушения правил сообщества. Конкретную причину этот перечень не называет, а приостановку не стоит смешивать с проблемой пароля.
- title: 'Если профиль заблокирован: что хранить'
  description: Уведомление и всю переписку. Паспорт и пароли незнакомцам не отправляем. Спор об авторстве картинок решается через отдельное обращение.
goals:
- Сохранить точный текст уведомления о приостановке.
- Отличать приостановку от забытого пароля, защитной проверки и временного ограничения.
- Записать факты и обращаться только по официальному порядку.
quiz:
- q: Что Анна делает первым делом?
  options:
  - Читает уведомление целиком и сохраняет формулировку
  - Создаёт новый аккаунт
  - Пишет в чат «разблокировщикам»
  answer: 1
  why: Точный текст понадобится при обращении.
- q: Объясняет ли перечень оснований из справки ваш случай?
  options:
  - Нет
  - Объясняет полностью
  - Только если там есть слово «спам»
  answer: 1
  why: Список общий, причину конкретного случая он не называет.
- q: Что записать, если причина не указана?
  options:
  - Отметить её как неизвестную и не угадывать
  - Придумать причину
  - Ничего
  answer: 1
  why: Причина считается установленной только по сообщению Pinterest.
- q: Незнакомец обещает вернуть аккаунт за деньги. Как быть?
  options:
  - Не отправлять документы и не верить гарантиям
  - Отправить паспорт
  - Оплатить
  answer: 1
  why: Обращение — только через официальный порядок.
