rutube_shorts:
- title: Показы в Пинтерест простыми словами
  description: Каждое появление карточки на экране. Одному человеку она могла попасться трижды — и он мог её даже не рассмотреть.
- title: Раскрыть пин и уйти на сайт — разные действия
  description: Первое — клик по публикации, второе — исходящий клик. Много показов не означает, что кто-то дошёл до сайта.
goals:
- Связать показы, сохранения, клики по пину и исходящие клики с действиями человека.
- Выбрать показатель под свою задачу.
- Сравнивать пины только при одинаковом периоде отчёта.
quiz:
- q: Что считают показы?
  options:
  - Сколько раз пин появлялся на экране
  - Сколько людей его увидело
  - Сколько человек купило
  answer: 1
  why: Один человек может увидеть пин несколько раз.
- q: Что показывает сохранение?
  options:
  - Человек добавил пин на свою доску
  - Человек перешёл на сайт
  - Человек купил товар
  answer: 1
  why: О переходах сохранение ничего не говорит.
- q: Ваша цель — привести человека на сайт. Какой показатель смотреть?
  options:
  - Исходящие клики
  - Показы
  - Сохранения
  answer: 1
  why: Исходящий клик — переход по прикреплённой ссылке.
- q: Много показов и ноль переходов — это…
  options:
  - 'Возможно, ошибки нет: действия не обязаны идти цепочкой'
  - Всегда сбой Pinterest
  - Блокировка аккаунта
  answer: 1
  why: Показ и переход — разные действия.
