rutube_shorts:
- title: Вертикальный формат для Пинтерест
  description: Рекомендованное соотношение — 2:3. Ставим снимок на такой холст и смотрим, не обрезались ли важные предметы.
- title: 'Текст на картинке пина: проверка мелким планом'
  description: 'Пара слов по теме, в стороне от главного предмета. Уменьшите изображение: если приходится щуриться — сокращайте.'
goals:
- Выбрать кадр, который показывает идею пина.
- Проверить исходное фото на резкость и видимость предметов.
- Подготовить вертикальное изображение 2:3 и короткую читаемую надпись.
quiz:
- q: Какие пропорции рекомендует Pinterest для пина с изображением?
  options:
  - Вертикальные 2:3
  - Горизонтальные 16:9
  - Квадрат 1:1 обязательно
  answer: 1
  why: Например, холст 1000×1500 пикселей.
- q: Нужные детали размыты в исходнике. Что делать?
  options:
  - Выбрать другой кадр или переснять
  - Добавить надпись поверх
  - Ничего не менять
  answer: 1
  why: Качество исходника не исправить обрезкой.
- q: Где разместить надпись?
  options:
  - Так, чтобы она не закрывала предметы
  - Поверх органайзера
  - Мелким шрифтом в углу
  answer: 1
  why: Текст не должен мешать увидеть идею.
- q: Как проверить читаемость надписи?
  options:
  - Уменьшить картинку и посмотреть
  - Увеличить до 200%
  - Спросить нейросеть
  answer: 1
  why: Пин часто смотрят на небольшом экране.
