rutube_shorts:
- title: Записывайте, откуда взялась каждая фраза
  description: 'Таблица формулировок: сама строка, задача человека, ваш материал и источник с датой — из подсказки, из уточнения выдачи или своя.'
- title: Две похожие строки в подсказках
  description: 'Иногда это одна задача, иногда разные. Отмечаем связь. И помним: подсказка не сообщает, сколько людей это ищет.'
goals:
- Отделять разные вопросы, даже если они похожи по словам.
- Вести таблицу формулировок с источником каждой.
- Не приписывать подсказкам поиска число людей или покупателей.
quiz:
- q: Вопросы о размещении канцелярии и о выборе органайзера — это…
  options:
  - Разные вопросы
  - Одна задача
  - Ключевые слова без смысла
  answer: 1
  why: Для второго нужны другие материалы.
- q: Какие столбцы в таблице формулировок?
  options:
  - Формулировка, вопрос человека, материал для ответа, источник
  - Цена, скидка, доставка
  - Лайки, сохранения, клики
  answer: 1
  why: Источник помогает потом проверить запись.
- q: Подсказок в поиске нет. Как быть?
  options:
  - Уточнить запрос своими словами и отметить это
  - Придумать подсказки от имени Pinterest
  - Прекратить работу
  answer: 1
  why: Свои слова записываем как свои.
- q: Фраза появилась в подсказке. Что это значит?
  options:
  - Что её кто-то ищет, но точного числа поисков мы не знаем
  - Что её ищут тысячи людей
  - Что она принесёт продажи
  answer: 1
  why: Подсказка не даёт количественных данных.
