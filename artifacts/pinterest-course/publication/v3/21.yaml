rutube_shorts:
- title: Что есть у вас для будущих пинов
  description: 'Четыре графы для каждого материала: что это, на какой вопрос отвечает, какая будет картинка и куда поведёт продолжение.'
- title: Перед тем как вписать материал в план
  description: Файл открывается, детали различимы, сведения свежие, страница соответствует заголовку. Нет — сначала доработка.
goals:
- Отделять идею материала от материала, который уже существует.
- Для каждого материала сформулировать один вопрос человека.
- Отметить стадию готовности и конкретный следующий шаг.
quiz:
- q: Анна задумала статью, но не написала её. В какой список она попадёт?
  options:
  - В «подготовить», а не в готовые материалы
  - В готовые
  - Никуда
  answer: 1
  why: Несуществующую статью в готовые не записываем.
- q: Как проверить материал перед включением в список?
  options:
  - Открыть файл или страницу и посмотреть содержимое
  - Вспомнить, что там было
  - Спросить подписчиков
  answer: 1
  why: Только так видно, что в нём действительно есть.
- q: Сколько вопросов человека записывать для одного материала?
  options:
  - Один понятный вопрос
  - Как можно больше
  - Ни одного
  answer: 1
  why: Так проще подобрать изображение и текст.
- q: Какая формулировка следующего шага лучше?
  options:
  - «Дописать абзац о хранении ручек»
  - «Заняться статьёй»
  - «Сделать красиво»
  answer: 1
  why: Конкретный шаг легко выполнить и проверить.
