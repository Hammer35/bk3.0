rutube_shorts:
- title: 'Таблица заготовок: статусы по шагам'
  description: Готовы снимок и текст, адрес ещё не проверен — пока «в работе». Вышло — меняем статус и вписываем дату и адрес.
- title: Финальный фильтр заготовки
  description: Понятна ли тема, видно ли изображение в ленте, нет ли лишних обещаний, продолжает ли страница тему. Четыре вопроса — и можно публиковать.
goals:
- Вести таблицу подготовки с графами от номера заготовки до адреса пина.
- Менять статус заготовки по мере готовности.
- Проверять каждую заготовку четырьмя вопросами перед публикацией.
quiz:
- q: У заготовки готовы картинка и текст, но ссылка не проверена. Какой статус?
  options:
  - В работе
  - Опубликовано
  - Готово
  answer: 1
  why: Статус меняется, когда сделан последний шаг.
- q: Зачем записывать адрес опубликованного пина?
  options:
  - Чтобы через несколько недель открыть отчёт именно по нему
  - Для красоты
  - Чтобы его удалить
  answer: 1
  why: Через недели адрес поможет открыть нужный отчёт.
- q: Что проверяют перед публикацией заготовки?
  options:
  - Тему, вид в ленте, текст без лишних обещаний, ссылку
  - Только цвет фона
  - Число хэштегов
  answer: 1
  why: Это последний фильтр перед выходом.
- q: Чем опасно держать сведения о заготовках в памяти?
  options:
  - Легко забыть, что не проверено
  - Ничем
  - Pinterest это запрещает
  answer: 1
  why: Таблица показывает, что осталось сделать.
