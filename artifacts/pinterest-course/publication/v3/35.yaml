rutube_shorts:
- title: Уход с Пинтерест — ещё не результат
  description: Метрика фиксирует только выход за пределы платформы. Прочтение, заявку или заказ ищите в данных сайта или магазина.
  cover: Клик — ещё не покупка
- title: Цифры трёх систем не сходятся
  description: Pinterest, сайт и маркетплейс считают по-своему. Храним данные раздельно и сначала разбираемся в правилах подсчёта.
  cover: Учёт по разным системам
goals:
- 'Понимать границу исходящих кликов: только уход с платформы.'
- Сформулировать цель перехода для статьи, услуги или товара.
- Хранить данные Pinterest, сайта и маркетплейса раздельно и выяснять, как считает каждый.
quiz:
- q: Что сообщают исходящие клики?
  options:
  - Только факт перехода по ссылке наружу
  - Что он прочитал статью
  - Что он купил товар
  answer: 1
  why: Чтение и покупка требуют отдельных данных.
- q: Какая цель подходит для пина-услуги?
  options:
  - Обращение
  - Показы
  - Сохранения
  answer: 1
  why: Для статьи — чтение, для товара — знакомство или заказ.
- q: Кто поможет настроить учёт действий на вашем сайте?
  options:
  - Тот, кто обслуживает сайт
  - Pinterest автоматически
  - Подписчики
  answer: 1
  why: Измерение обсуждают с администратором ресурса.
- q: Данные Pinterest и маркетплейса не совпадают. Что делать?
  options:
  - Выяснить, как каждый источник считает показатели
  - Сложить цифры
  - Выбрать большую
  answer: 1
  why: Источники держат раздельно.
