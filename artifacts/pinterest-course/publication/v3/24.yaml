rutube_shorts:
- title: Отложить идею или сделать свою публикацию
  description: В плане это две отдельные строки. Своя публикация требует вопроса, снимка, текста и проверки — сохранение находки их не заменяет.
- title: Чьи пины попали в ваш отчёт
  description: Стандартный обзор считает опубликованное, отложенное подключается вручную. Проверяем настройку до сравнения.
goals:
- Различать созданный и сохранённый контент по справке Pinterest.
- 'Отмечать в плане вид работы: собрать идею или подготовить свою публикацию.'
- Проверять, какие пины включены в отчёт аналитики.
quiz:
- q: Что относится к опубликованному контенту по справке?
  options:
  - Пины, созданные вами, и пины с вашего подтверждённого сайта
  - Все пины на ваших досках
  - Только рекламные пины
  answer: 1
  why: Сохранённое из Pinterest и с чужих сайтов — отдельная группа.
- q: Анна сохранила чужой пин с фото рабочего места. Что изменилось?
  options:
  - Идея добавилась в её подборку, автором она не стала
  - Она стала автором фото
  - Пин удалился у автора
  answer: 1
  why: Авторство при сохранении не переходит.
- q: Что показывает обзор аналитики по умолчанию?
  options:
  - Опубликованные пины; сохранённые включаются отдельной настройкой
  - Только сохранённые
  - Всё вместе без настроек
  answer: 1
  why: Проверяйте настройку перед сравнением.
- q: Что такое подтверждённый сайт?
  options:
  - Сайт, владение которым подтверждено в Pinterest
  - Любой сайт в профиле
  - Сайт с рекламой
  answer: 1
  why: Определение из справки.
