rutube_shorts:
- title: Из чего складывается рекламная кампания
  description: Цель, объявление, страница. Код измерения ставится на сайт; для него, по справке, нужны бизнес- и рекламный аккаунты. Ничего не запускали.
- title: Четыре вопроса до первого рубля на рекламу
  description: Регион, посадочная страница, способ измерения, допустимые траты. Если что-то неизвестно, тратить рано.
goals:
- Назвать, из чего состоит рекламная кампания.
- Объяснить назначение Pinterest Tag и требования к аккаунтам.
- Ответить на вопросы о регионе, странице, измерении и бюджете до любых трат.
quiz:
- q: Что нужно рекламной кампании?
  options:
  - Цель, объявление и страница назначения
  - Только картинка
  - Только бюджет
  answer: 1
  why: Результат зависит ещё и от настроек и доступности функции.
- q: Что такое Pinterest Tag?
  options:
  - Код на сайте для учёта действий посетителей в связи с рекламой
  - Хэштег
  - Значок профиля
  answer: 1
  why: По справке для установки нужны бизнес- и рекламный аккаунт.
- q: Можно ли встроить Tag в страницу товара на маркетплейсе?
  options:
  - Сначала выяснить, разрешает ли это площадка
  - Да, всегда
  - Да, через описание товара
  answer: 1
  why: Доступа к чужому коду нельзя предполагать.
- q: Создавали ли кампанию в уроке?
  options:
  - Нет, только разбор без запуска и расходов
  - Да
  - Да, с бюджетом
  answer: 1
  why: Реклама требует расходов — сначала вопросы.
