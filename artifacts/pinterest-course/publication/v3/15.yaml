rutube_shorts:
- title: Поменять адрес в уже вышедшем пине
  description: Сначала убеждаемся, что новая страница рабочая и содержит обещанное. Потом правим поле в редакторе и проверяем переход ещё раз.
- title: 'Опечатка на картинке: правка невозможна'
  description: Изображение у вышедшей публикации не меняется. Исправляем макет, сохраняем новый файл и делаем отдельную публикацию.
goals:
- 'Определить, где ошибка: в заголовке, описании, ссылке или на картинке.'
- Исправить текст или ссылку через редактирование пина.
- Понять, почему ошибку на изображении исправляют новым пином.
quiz:
- q: В заголовке опечатка. Нужно ли заново загружать картинку?
  options:
  - Нет, достаточно отредактировать текст
  - Да, обязательно
  - Нужно удалить профиль
  answer: 1
  why: Текст правят в редакторе пина.
- q: От чего зависит набор полей для правки?
  options:
  - От того, как создан пин
  - От числа подписчиков
  - От времени суток
  answer: 1
  why: Смотрите, какие поля доступны у вашей публикации.
- q: Перед заменой ссылки нужно…
  options:
  - Открыть новую страницу отдельно и проверить её
  - Сразу вставить любой адрес
  - Удалить пин
  answer: 1
  why: Проверяем доступность и содержание.
- q: Опечатка в надписи на картинке. Что делать?
  options:
  - Исправить макет и сделать новый пин
  - Отредактировать изображение в пине
  - Оставить как есть
  answer: 1
  why: Изображение опубликованного пина заменить нельзя.
