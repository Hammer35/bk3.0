rutube_shorts:
- title: Сравниваем две публикации честно
  description: Общая метрика, отрезок после выхода каждой. На учебном экране период начался раньше публикации — такое сравнение некорректно.
- title: Факт из отчёта против догадки о причине
  description: 'Разница в цифрах — факт. Объяснение этой разницы — гипотеза: влиять могли дата, кадр, текст и многое другое.'
goals:
- Сравнивать пины по одному и тому же показателю.
- Брать сопоставимые периоды с учётом даты выхода каждого пина.
- Отделять наблюдение от предположения о причине.
quiz:
- q: Сравниваете сохранения двух пинов. Что смотреть у второго?
  options:
  - Тоже сохранения
  - Раскрытия публикации
  - Переходы на сайт
  answer: 1
  why: Подменять показатель нельзя.
- q: Пин опубликован 8 октября, а период отчёта начинается 13 сентября. Что не так?
  options:
  - Часть периода пина ещё не существовало
  - Всё верно
  - Даты не важны
  answer: 1
  why: Период должен начинаться после выхода.
- q: «У первого пина больше сохранений» — это…
  options:
  - Наблюдение
  - Доказанная причина
  - Гипотеза о теме
  answer: 1
  why: Объяснение разницы — отдельное предположение.
- q: У одного пина в десять раз больше показов. Что учитывать?
  options:
  - Разницу в возможности получить действие
  - Ничего
  - Только сохранения
  answer: 1
  why: При большой разнице показов итоговые числа сравнивать мало.
