rutube_shorts:
- title: Одна публикация — один вопрос
  description: 'Перед дизайном записываем три вещи: что спрашивает человек, что увидит на снимке и где прочтёт ответ целиком. Пример — мелочи на крошечном столе.'
- title: Если мысль не укладывается в фразу
  description: Значит, тема для одной карточки слишком широкая. Сужайте, пока зритель не поймёт с первого взгляда, что получит.
goals:
- Выбрать для пина одну конкретную задачу из большого материала.
- Проверить, что ответ на вопрос пина действительно есть в статье.
- 'Составить заметку из трёх строк: вопрос, изображение, продолжение.'
quiz:
- q: В статье Анны пять идей. Что она выносит в пин?
  options:
  - Одну конкретную задачу
  - Все пять сразу
  - Только название блога
  answer: 1
  why: Один пин — одна задача и один понятный вопрос.
- q: В статье органайзер лишь упомянут. Можно ли обещать подробную инструкцию?
  options:
  - Нет, рано
  - Да
  - Да, если пин красивый
  answer: 1
  why: Обещание пина должно подтверждаться страницей.
- q: Из каких строк состоит заметка?
  options:
  - Вопрос, изображение, продолжение
  - Цена, скидка, доставка
  - Хэштеги, дата, доска
  answer: 1
  why: Эти три строки и составляют план пина.
- q: Тема не помещается в одно ясное предложение. Что делать?
  options:
  - Сузить её
  - Добавить больше хэштегов
  - Опубликовать как есть
  answer: 1
  why: Узкий вопрос понятнее зрителю.
