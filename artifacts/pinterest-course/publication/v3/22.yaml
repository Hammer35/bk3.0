rutube_shorts:
- title: Одна статья — разные кадры под разные вопросы
  description: Для каждого вопроса подбираем свой снимок. Нет подходящей фотографии — эта тема пока не готова к публикации.
- title: 'Тест на копию: убираем картинку'
  description: Если два заголовка отвечают на одну задачу, это повтор, сколько ни меняй оформление.
goals:
- Найти в одном материале отдельные вопросы с понятными ответами.
- Подобрать к каждому вопросу свою идею изображения.
- Отличить самостоятельную идею от повтора с другим оформлением.
quiz:
- q: Сколько пинов делать из одной статьи?
  options:
  - Столько, сколько в ней самостоятельных тем
  - Всегда десять
  - Всегда один
  answer: 1
  why: Количество заранее не задаём.
- q: Можно ли по одной фотографии органайзера утверждать, что раскрыты три вопроса?
  options:
  - Нет, для каждого нужен свой материал
  - Да
  - Да, если фото качественное
  answer: 1
  why: Каждую идею должен подкреплять материал.
- q: Два заголовка отличаются словом «очень». Это разные пины?
  options:
  - Нет, задача та же
  - Да
  - Да, если цвет фона другой
  answer: 1
  why: Различие должно быть в задаче, а не в оформлении.
- q: Что выписывать при чтении текста?
  options:
  - Вопросы, на которые в нём есть понятные ответы, и где именно ответ
  - Все существительные
  - Только заголовки
  answer: 1
  why: Это основа для отдельных пинов.
