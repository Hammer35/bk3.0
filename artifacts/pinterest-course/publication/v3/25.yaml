rutube_shorts:
- title: 'Материалы для коллажа: тема и права'
  description: Сформулируйте идею одним предложением, уберите лишнее, используйте разрешённые снимки и записывайте, откуда каждый.
- title: Собираем коллаж из вырезок
  description: Главный предмет крупно, остальное помогает понять сочетание. Уменьшите результат и проверьте, читается ли замысел.
goals:
- Сформулировать тему коллажа одним предложением.
- Подобрать изображения и вырезки с правом на использование и записать источники.
- Собрать композицию с главным предметом и проверить её в маленьком размере.
quiz:
- q: Из чего собирают коллажи в Pinterest?
  options:
  - Из изображений и вырезок — отдельных объектов
  - Только из видео
  - Только из текста
  answer: 1
  why: Вырезка — объект или фрагмент изображения.
- q: Одинаков ли редактор коллажей на всех устройствах?
  options:
  - Нет, набор инструментов различается
  - Да
  - Его нет нигде
  answer: 1
  why: Сначала проверьте пункт «Коллаж» в своём меню.
- q: Сохранённый чужой пин в вашем коллаже — это…
  options:
  - Чужая фотография; нужны права и указание источника
  - Ваша фотография
  - Бесплатная картинка
  answer: 1
  why: Сохранение не делает снимок вашим.
- q: Коллаж из стола, лампы и органайзера показывает…
  options:
  - Идею сочетания вещей, а не обустроенную комнату
  - Готовый интерьер
  - Фото квартиры Анны
  answer: 1
  why: Подписывайте композицию честно.
