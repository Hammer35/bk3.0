rutube_shorts:
- title: Откуда в статистике пина действия с копий
  description: Если такое же изображение загружено несколько раз, Pinterest может сложить их взаимодействия. Ваша цифра включает и их.
- title: Вчерашнее число стало меньше
  description: Свежие значения платформа считает предварительными и уточняет. Записывайте дату просмотра и условия отчёта.
goals:
- Открыть подробную статистику одного пина.
- Выбрать показатель под конкретный вопрос.
- Учитывать объединение данных по одинаковым изображениям и пересчёт свежих значений.
quiz:
- q: Где найти статистику своего пина?
  options:
  - Профиль → вкладка «Созданные» → пин → подробная статистика
  - В поиске по ключевому слову
  - В рекламном кабинете
  answer: 1
  why: Такой путь разобран на экране учебного аккаунта.
- q: Почему в цифре пина могут быть действия с чужих копий?
  options:
  - Pinterest объединяет данные публикаций с одинаковым изображением
  - Это ошибка
  - Так считают все соцсети
  answer: 1
  why: Число может учитывать несколько копий.
- q: Свежая цифра сегодня меньше вчерашней. Почему?
  options:
  - Значения в реальном времени предварительные и пересчитываются
  - Пин удалили
  - Аккаунт заблокирован
  answer: 1
  why: Записывайте дату просмотра.
- q: С чего начать работу со статистикой пина?
  options:
  - С вопроса, на который хотите ответить
  - С самого большого числа
  - С подсчёта всех метрик
  answer: 1
  why: Вопрос определяет нужный показатель.
