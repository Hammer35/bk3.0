rutube_shorts:
- title: 'Какую страницу поставить в пин: два случая'
  description: Публикация про подборку советов → страница с этими советами. Публикация про один органайзер → его карточка в магазине. Учебный разбор.
- title: Откройте свою ссылку на телефоне
  description: 'Быстрый тест перед публикацией: страница открылась, нужное видно сразу, искать не приходится. И не путайте переход с заказом.'
goals:
- Определить, что человек должен найти после перехода по ссылке пина.
- 'Подобрать страницу: статью для пина-инструкции, карточку для пина о товаре.'
- Проверить совпадение картинки, заголовка и страницы перед публикацией.
quiz:
- q: Пин обещает пять идей для стола, но открывается главная страница магазина. В чём ошибка?
  options:
  - Страница не продолжает обещание пина
  - Ошибки нет
  - Пин слишком вертикальный
  answer: 1
  why: Человек должен сразу попасть на материал с этими пятью идеями.
- q: Какие три вещи должны рассказывать об одной теме?
  options:
  - Изображение, заголовок и страница по ссылке
  - Аватар, обложка доски и пароль
  - Хэштеги, дата и цвет фона
  answer: 1
  why: Так в уроке проверяют, что ссылка продолжает пин.
- q: У органайзера несколько расцветок. Что проверить на карточке товара?
  options:
  - Что легко найти именно вариант с пина
  - Что на странице есть отзывы
  - Ничего
  answer: 1
  why: Человек должен увидеть то, что ему показали на картинке.
- q: Что означает переход по ссылке?
  options:
  - Покупку
  - Продолжение знакомства с идеей, но не покупку
  - Подписку на профиль
  answer: 2
  why: Переход ещё не означает покупку.
