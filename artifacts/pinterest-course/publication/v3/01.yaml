goals:
- Своими словами объяснить разницу между отдельной публикацией и подборкой.
- 'Описать путь человека: от картинки в Pinterest к статье или карточке товара по ссылке.'
- Отличить переход по ссылке от покупки и не обещать заранее просмотры и переходы.
- Составить первую заготовку своей публикации по формуле «В пине я покажу… По ссылке человек найдёт…».
quiz:
- q: Как в Pinterest называется отдельная публикация?
  options:
  - Доска
  - Пин
  - Профиль
  answer: 2
  why: Отдельная публикация — пин. Доска — подборка пинов, профиль — ваша страница.
- q: Зачем нужны доски?
  options:
  - Чтобы складывать понравившиеся публикации по одной теме
  - Чтобы оплатить продвижение
  - Чтобы написать сообщение автору пина
  answer: 1
  why: 'В уроке на такой подборке копят идеи для письменного угла.'
- q: Анна сделала пин о конкретном органайзере. Куда лучше вести ссылку?
  options:
  - На главную страницу сайта
  - На карточку именно этого органайзера
  - На любую страницу блога
  answer: 2
  why: 'Пин про один товар логично продолжать его карточкой.'
- q: Человек перешёл по ссылке из пина. Что это значит?
  options:
  - Он точно купил товар
  - Он перешёл к подробностям, но покупка из этого не следует
  - Пин гарантированно наберёт просмотры
  answer: 2
  why: Сам переход ещё не говорит, что человек сделал покупку.
- q: Что нужно сделать до публикации пина со ссылкой?
  options:
  - Проверить, что ссылка ведёт туда, куда обещает текст
  - Ничего, Pinterest проверит сам
  - Убрать описание
  answer: 1
  why: 'Проверка адреса — обязательный шаг перед кнопкой «Опубликовать».'
rutube_shorts:
- title: 'Пин и доска: два главных слова Пинтерест'
  description: 'Новичку в Пинтерест хватит двух понятий: публикация с картинкой и папка, куда её откладывают. Покажем на подборке идей для письменного угла.'
- title: 'Ссылка из пина: статья, товар или ничего'
  description: 'Публикация обещает подробности — значит, по адресу они должны найтись. Учимся выбирать страницу и помним: клик ещё не продажа.'
