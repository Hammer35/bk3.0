rutube_shorts:
- title: Личный профиль Пинтерест или отдельный для дела
  description: Если в старом аккаунте рецепты и путешествия, под проект лучше завести новый. Если он уже про работу — тип можно сменить.
- title: Перед сменой типа профиля Пинтерест
  description: Бизнес-страницу увидит любой. Пройдитесь по подборкам и сведениям о себе; закрытые доски останутся видны только вам и приглашённым.
goals:
- Выбрать между личным и бизнес-аккаунтом под свою задачу.
- Решить, создавать новый бизнес-профиль или переводить существующий.
- Проверить, что станет видно публично после перевода.
quiz:
- q: Зачем проекту бизнес-аккаунт?
  options:
  - Он даёт доступ к аналитике пинов и рекламным инструментам
  - Без него нельзя искать идеи
  - Он платный и поэтому лучше
  answer: 1
  why: Бизнес-аккаунт бесплатный и открывает аналитику и рекламу.
- q: Почему Анна заводит отдельный профиль?
  options:
  - Чтобы не смешивать дело с рецептами и отпуском
  - Потому что личный нельзя перевести
  - Потому что так требует Pinterest
  answer: 1
  why: Её личный аккаунт посвящён другим темам.
- q: Что происходит с пинами и подписчиками при переводе профиля в бизнес?
  options:
  - Удаляются
  - По справке Pinterest сохраняются
  - Переходят в новый аккаунт
  answer: 2
  why: Об этом сказано в официальной справке.
- q: Кому видны секретные доски?
  options:
  - Всем
  - Вам и приглашённым участникам
  - Только подписчикам
  answer: 2
  why: У секретных досок отдельная видимость.
