rutube_shorts:
- title: Какие сведения подтягивает расширенный пин
  description: Статье — название и автор, товару — цена и наличие, у рецептов свой набор. Появляются они не у каждой публикации.
  cover: Данные с сайта в пине
- title: Настроили Rich Pins — сверьте с источником
  description: 'Откройте конкретную страницу и её публикацию: совпадают ли данные. Ориентируйтесь на свежую инструкцию.'
  cover: Сверка с источником
goals:
- Рассказать, какие данные публикация может автоматически взять со страницы сайта.
- Понимать, что для них нужна подготовка страниц и разметка.
- Учитывать ограничения карточки маркетплейса, где код вам не принадлежит.
quiz:
- q: Что такое расширенные пины?
  options:
  - Публикации, которые автоматически получают сведения с сайта
  - Платные пины
  - Пины без картинки
  answer: 1
  why: Так их описывает Pinterest.
- q: Что может показать расширенный пин товара?
  options:
  - Цену и наличие
  - Отзывы покупателей
  - Число продаж
  answer: 1
  why: Для статей — заголовок, описание и автора.
- q: Что такое разметка?
  options:
  - Структурированные сведения в коде сайта
  - Надпись на картинке
  - Хэштеги
  answer: 1
  why: По ней сервис распознаёт содержимое страницы.
- q: Можно ли считать, что расширенные пины уже работают у Анны?
  options:
  - Нет, их не подключали и результат не проверяли
  - Да
  - Да, у всех блогов
  answer: 1
  why: Заявлять о подключении можно только после проверки на реальной странице.
