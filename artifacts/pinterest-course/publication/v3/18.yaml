rutube_shorts:
- title: Заголовок под формулировку из таблицы
  description: Берём фразу, пишем название, сверяем с фото и текстом. Сколько советов в статье — столько и в названии.
- title: Перечень слов через запятую — не описание
  description: 'Читаем вслух: если звучит как список покупок, связываем слова в живые предложения. Справка Pinterest советует то же.'
goals:
- Составить заголовок из формулировки таблицы так, чтобы он передавал вопрос или ответ.
- Написать описание связными предложениями, а не перечнем слов.
- Проверить, подкреплено ли каждое обещание текста снимком и статьёй.
quiz:
- q: Вы обещаете пять способов хранения. Что должно быть в материале?
  options:
  - Именно пять способов
  - Хотя бы один
  - Ссылка на магазин
  answer: 1
  why: Обещание и содержание должны совпадать.
- q: Чем плох текст «стол, хранение, органайзер, порядок, купить»?
  options:
  - Он перечисляет слова, но почти ничего не объясняет
  - Он слишком длинный
  - Он без хэштегов
  answer: 1
  why: Слова нужно связать в предложения.
- q: Нужно ли заново публиковать учебный пин в этом уроке?
  options:
  - Нет, мы разбираем имеющийся пример
  - Да
  - Да, дважды
  answer: 1
  why: Так сказано в уроке.
- q: Что делает хороший заголовок пина?
  options:
  - Передаёт вопрос или содержание ответа
  - Обещает сверх содержания
  - Состоит из хэштегов
  answer: 1
  why: Красивое обещание не подменяет материал.
