youtube:
  titles:
    - "Обзор аккаунта в аналитике Pinterest: период, фильтры — урок 28"
    - "Общая статистика: не обманитесь настройками"
    - "Прочерк — это не ноль. Правила записи данных из Pinterest"
  thumbs:
    - "Обзор аккаунта"
    - "Сначала настройки"
    - "Прочерк ≠ 0"
  description: |
    Двадцать восьмое занятие. Открываем общий обзор аккаунта и учимся читать отчёт с учётом его настроек.

    По шагам:
    • аналитика доступна в бизнес-аккаунте: меню → аналитика → обзор;
    • период: готовый диапазон или свои даты; фиксируем точные границы;
    • фильтры: обычные публикации без продвижения, формат пина, устройство; включены ли сохранённые;
    • меняем по одной настройке, чтобы понимать, что изучаем;
    • показатель под вопрос: переходы к блогу — исходящие клики;
    • график внутри периода и список пинов — проверяем сортировку;
    • пустые и нулевые значения записываем как есть; свежие данные могут пересчитать.

    Учебный аккаунт, героиня вымышлена.

    Задание: одна полная запись по шаблону из видео (или сообщение интерфейса вместо числа).

    Справка: https://help.pinterest.com/en/business/article/pinterest-analytics
  hashtags: [АналитикаPinterest, Pinterest, КурсPinterest]
  tags: [обзор аналитики pinterest, фильтры аналитики pinterest, период отчета, статистика аккаунта pinterest, pinterest analytics, исходящие клики, pinterest для бизнеса, анализ данных]
  comment: |
    Открыли свой обзор? Напишите, какой период и фильтры выбрали — подскажем, что записать.
  shorts:
    - title: "«Последние 30 дней» завтра уже другие"
      description: |
        Записывайте точные даты начала и конца периода. Иначе при следующем просмотре сравните несопоставимое.
      hashtags: [pinterest, shorts, аналитика]
      hook: "Даты сдвигаются"
      cover: "Точные даты"
    - title: "Прочерк в аналитике Pinterest: не меняйте на ноль"
      description: |
        Сохраните то, что показывает интерфейс: ноль, прочерк или сообщение о недостатке данных. Это разные вещи.
      hashtags: [pinterest, shorts, данные]
      hook: "Прочерк — не ноль"
      cover: "Как записать"

