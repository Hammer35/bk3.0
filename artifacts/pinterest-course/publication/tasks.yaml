1:
  instagram: '📝 Задание

    Три пина из вашей ниши → что зацепило → что сохранили бы → куда ведёт кнопка.

    И одна строка про ваш будущий пин: картинка + куда кнопка.

    Жду вашу строку 👇

    '
  official: 'Урок 1. Что такое Pinterest


    Найдите три пина по теме своего проекта.

    Для каждого ответьте:

    — Что привлекло внимание?

    — Что хочется сохранить?

    — Куда ведёт ссылка?


    Затем закончите фразу:

    «В своём пине я покажу… А по ссылке человек найдёт…».


    Получилась первая заготовка для публикации.'
  rutube: 'Практика по уроку 1: Подберите три публикации по теме собственного проекта. По каждой зафиксируйте: элемент, привлёкший внимание; ценность для сохранения; адрес перехода. Сформулируйте заготовку собственного пина по схеме «изображение — продолжение по ссылке».

    '
  source: Урок_01_Что_такое_Pinterest/04_Документы/Задание_ученику.txt
  threads: 'Задание к первому уроку, на 10 минут: найдите три пина про своё дело, посмотрите, что в них цепляет и куда они уводят. Затем одной строкой — что покажете вы и что человек получит по ссылке. Делитесь в ответах.

    '
  vk_video: 'Домашка после первого видео: отыщите три чужих пина по вашей теме, разберите каждый — что цепляет, что сохранили бы, на какую страницу он отправляет. Потом закончите фразу «покажу на картинке… человек найдёт по ссылке…». Это и есть заготовка первой публикации.

    '
  youtube: '📌 Домашнее задание · урок 1

    1) Найдите в Pinterest три пина на тему своего проекта.

    2) Для каждого ответьте: чем зацепил, что хочется сохранить, куда ведёт ссылка.

    3) Одной фразой: ваш кадр и страница за ним.

    Пришлите получившуюся фразу ответом.

    '
