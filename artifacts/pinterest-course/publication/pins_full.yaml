1:
  b: 'Как пользоваться Пинтерест, если вы только зарегистрировались: четыре слова-шпаргалка. Поиск — человек приходит с задачей. Пин — одна идея в картинке. Доска — подборка идей по теме. Ссылка — путь к вашей странице. Сохраните карточку и держите под рукой в первые дни.

    '
  v: 'Пинтерест как работает: публикации и подборки. Отдельная публикация называется пином, а понравившиеся пины сохраняют на доски — тематические подборки. В ролике пример: собрать идеи рабочего места в одном месте, чтобы вернуться к ним позже. Видео для тех, кто только знакомится с Pinterest.

    '
2:
  b: 'Пинтерест поиск и лента устроены по-разному. В поиске вопрос задаёте вы, лента учитывает ваши сохранения, фильтры сужают выдачу, а похожее можно искать и по фото. Поэтому по своей ленте нельзя судить о спросе. Шпаргалка из четырёх пунктов для начинающих.

    '
  v: 'Как уточнить поиск в Пинтерест: начинаем с темы «рабочее место дома» и добавляем задачу — «хранение на столе», затем «на маленьком столе». Pinterest может предложить уточнения запроса и фильтры, их названия зависят от устройства. Ролик пригодится, если среди тысяч картинок не находится нужная.

    '
3:
  b: 'Создать пин или сохранить чужой — в чём разница. Своё фото — вы создаёте пин. Чужая идея — вы её сохраняете. Доска собирает и то и другое, но автор фото при сохранении не меняется. Памятка для блогеров и магазинов, которые собирают подборки в Pinterest.

    '
  v: 'Пин, доска и их отличия на одном примере. Пин — отдельная публикация: изображение или видео с заголовком, пояснением и, если есть статья или товар, ссылкой. Доска — тематическая подборка: в примере на ней собраны идеи столов, освещения и хранения. Героиня ролика вымышлена.

    '
4:
  b: 'Пинтерест ссылка на сайт: проверка перед выходом пина. Страница продолжает тему картинки, открывается на телефоне, обещанное видно сразу, а для товара открывается тот самый вариант. Мини-чек-лист перед тем, как прикрепить адрес к пину.

    '
  v: 'Трафик из пинтерест: статья или карточка товара — какой адрес поставить. Если на пине пять идей для рабочего места, ссылка ведёт на статью со всеми пятью. Если показан конкретный органайзер — на страницу этого товара. Разбор на примере вымышленной героини курса.

    '
5:
  b: 'Бизнес аккаунт в Пинтерест: что решить до смены типа профиля. Страница посвящена вашему делу — можно поменять тип. Темы перемешаны — удобнее отдельный аккаунт. Для нового понадобится почта, не занятая другим профилем, а бизнес-профиль виден всем. Памятка перед переходом.

    '
  v: 'Бизнес аккаунт в Пинтерест: менять тип старого профиля или создавать отдельный. В примере в личном аккаунте героини уже лежат рецепты и идеи для отпуска, поэтому для домашнего проекта она заводит новый профиль. Если ваш профиль уже посвящён делу, его можно преобразовать. Героиня вымышлена.

    '
6:
  b: 'Как оформить профиль в Пинтерест: проверка шапки. Имя называет и вас, и тему. Аватар узнаётся даже в маленьком кружке. В описании сказано, о чём ваши публикации. Сайт открывается с телефона. Сохраните чек-лист и сверьте свой профиль по пунктам.

    '
  v: 'Имя и аватар для профиля: в примере берём название «Анна — Порядок дома», которое связывает автора с темой. Бренду лучше использовать своё название и знак. Изображение проверяем в маленьком размере. Короткое видео об оформлении профиля; героиня придумана.

    '
7:
  b: 'Доска в Пинтерест: проверка перед тем, как её наполнять. Одна тема без смешения, название объясняет содержимое, видимость выбрана осознанно, каждый пин помогает теме. Четыре пункта, по которым видно, что подборка понятна людям.

    '
  v: 'Как создать доску в Пинтерест: открываем профиль, находим создание доски, вводим название и перед сохранением решаем — открытая подборка или секретная. В примере выбираем открытую. На компьютере и телефоне кнопки могут стоять в разных местах — смотрите на свой экран.

    '
8:
  b: 'Пора ли делить доску на разделы в Пинтерест? Да, если нужное ищется долго, внутри темы появились отдельные направления и каждую группу легко назвать. При маленьком числе публикаций с разделами можно подождать. Шпаргалка из четырёх вопросов.

    '
  v: 'Как создать раздел в Пинтерест: открываем доску «Рабочее место дома», находим добавление раздела, вводим название «Освещение» и подтверждаем. Раздел появляется внутри выбранной доски. Подписи элементов на разных устройствах могут не совпадать. Короткая видеоинструкция.

    '
9:
  b: 'Адрес сайта видят люди, подтверждение сайта нужно Pinterest. Адрес вписывают в профиле, для подтверждения нужен доступ к управлению ресурсом — тег, файл или запись DNS. Нет сайта — поле остаётся пустым. Шпаргалка о двух разных настройках бизнес аккаунта.

    '
  v: 'Где в Pinterest поле для ссылки на сайт: открываем редактирование профиля и находим поле «Веб-сайт». В учебном аккаунте оно пустое — сайт для курса не подключали. Если у вас есть сайт, впишите адрес страницы, которую хотите открыть посетителю, и сохраните изменения.

    '
10:
  b: 'Заполните до дизайна: короткий план и одна проверка. Вопрос человека, что покажет картинка, где полный ответ — и влезает ли всё это в одну фразу. Шаблон помогает выбрать одну тему для пина вместо нескольких сразу.

    '
  v: 'Заметка из трёх строк перед первым пином. Вопрос: как уместить письменные принадлежности на крошечном столе? Изображение: органайзер с этими предметами на рабочем месте. Продолжение: статья с этим вариантом и другими идеями. Короткий пример того, как сузить тему до одного вопроса.

    '
11:
  b: 'Перед публикацией картинки в Pinterest проверьте четыре вещи: главный предмет в кадре, пропорции 2:3, текст не закрывает товар, всё читается в маленьком размере. Проверка, которая пригодится перед каждой загрузкой.

    '
  v: 'Размер пина для Пинтерест: для обычного пина с изображением Pinterest рекомендует вертикальный формат два к трём — скажем, холст тысяча на полторы тысячи пикселей. Ставим фотографию и смотрим кадрирование: все предметы на столе видны, ничего не растянуто.

    '
12:
  b: 'Слова-пустышки в заголовке пина — первое, что стоит вычеркнуть. Эти слова обещают, но не сообщают, о чём пин. Вместо них — конкретный вопрос, который человек вводит в поиск Pinterest. Шпаргалка стоп-слов.

    '
  v: 'Пинтерест описание и заголовок на учебном пине про мелочи на столе: заголовок называет задачу, а подпись объясняет снимок и приглашает в блог. Ролик-образец понятной подписи без громких обещаний.

    '
13:
  b: 'Alt-текст в Pinterest — про картинку, описание — про материал. Первое поле помогает людям с программами чтения экрана представить изображение, второе объясняет пользу публикации. Шпаргалка, чтобы не писать в двух полях одинаковый текст.

    '
  v: 'Альтернативный текст пинтерест на примере фото рабочего стола: перечисляем видимые предметы, говорим, где каждый лежит, и переписываем надпись над снимком. Без оценок и рекламных слов — одни факты изображения.

    '
14:
  b: 'Пин вышел — что теперь? Откройте его и посмотрите на картинку, перечитайте тексты, нажмите на ссылку, запишите адрес и дату. Четыре действия сразу после публикации, чтобы первый пин в Pinterest не вёл в никуда.

    '
  v: 'Ссылка в пине должна быть настоящей. Перед вставкой адреса откройте страницу и проверьте, доступен ли обещанный материал. В учебном примере статью не подготовили, поэтому ссылку не придумываем и оставляем пин черновиком. Свой пин ведите только на существующую страницу.

    '
15:
  b: 'Где ошибка — такой и шаг. Текст исправляют в редакторе, ссылку проверяют и меняют, надпись на фото требует нового пина, а удаление отменить нельзя. Подсказка для тех, кто нашёл ошибку в опубликованном пине Pinterest.

    '
  v: 'Исправление адреса в опубликованной публикации: сначала отдельно открываем нужную страницу и проверяем, что она доступна и содержит обещанное. Затем вставляем правильный адрес, сохраняем правку, открываем пин и переходим по ссылке ещё раз. Любой адрес «лишь бы было» не годится.

    '
16:
  b: 'Недельный шаблон для пинов: какой вопрос человека раскрываете, что покажет изображение, какой материал ответит, готов он или его нужно подготовить. Шаблон помогает превратить широкую тему аккаунта Pinterest в конкретные идеи.

    '
  v: 'Как сузить тему для пинов: путь от «организации дома» к «рабочему месту» и дальше к «хранению на маленьком столе». Это учебные примеры запросов — мы не называем их найденными подсказками и не утверждаем, что они популярны. Свои формулировки записывайте отдельно от увиденного в поиске.

    '
17:
  b: 'Таблица ключевых слов для Пинтерест: сама фраза, какой вопрос за ней стоит, чем вы ответите и откуда фраза взялась. Помогает собирать слова из поиска, а не придумывать их. Сохраните шаблон и ведите для своего аккаунта.

    '
  v: 'Ключевые слова для Пинтерест: у каждой записанной фразы есть столбец происхождения. Там отмечаем, где встретили слова: в подсказке, в уточнении поиска или придумали сами, плюс исходный запрос и дату.

    '
18:
  b: 'Места для поисковых фраз в Pinterest: заголовок — задача и место, описание — связным текстом, доска — тема совпадает. А в альтернативный текст ключевые слова не вставляют: он описывает картинку. Шпаргалка по SEO пина.

    '
  v: 'SEO Pinterest без пустых обещаний: берём одну формулировку из таблицы, пишем по ней заголовок и сверяем со снимком и текстом. Число в заголовке должно совпадать с числом советов, а единственный вариант не выдаём за подборку.

    '
19:
  b: 'Типичные промахи в Pinterest Trends: не считайте значение 100 количеством запросов, не переносите данные чужого региона, не придумывайте причины всплесков. Пустой график не значит, что тема никому не нужна. Шпаргалка для работы с трендами.

    '
  v: 'Пинтерест тренды: что означает шкала. Открываем раздел трендов, задаём тему и отрезок времени. Высшая точка графика всегда равна ста: это сравнение внутри одной линии, а не число поисков или покупателей. Все прочие значения считаются от этой вершины.

    '
20:
  b: 'Подготовка сезонного пина: сверить два года на графике, отдельно записать прогноз, расписать сроки этапов и решить, берёте ли идею. План подготовки для тех, кто использует Pinterest Predicts и тренды.

    '
  v: 'Pinterest predicts и сезонные темы: расписание подготовки. Для материала могут понадобиться фото, текст, проверка ссылки и оформление пина — расписываем шаги и сроки. Вершины графика не ждём, но и не считаем, что история интереса задаёт дату публикации или обещает результат.

    '
21:
  b: 'Статус каждого материала для будущих пинов: готово к пину, нужен текст, нужна фотография, проверить страницу. Шпаргалка помогает вести контент-план Pinterest и видеть, что можно публиковать уже сейчас.

    '
  v: 'Контент план Пинтерест в таблице из четырёх полей: сам материал, вопрос, картинка и адрес продолжения. Пример: фото органайзера и вопрос «Где хранить ручки?». Если страницы для ссылки ещё нет, отмечаем, что её нужно подготовить.

    '
22:
  b: 'Отдельная публикация отвечает на свой вопрос, опирается на ответ из текста и показывает свою картинку. Перекраска фона копию не меняет. Проверка для тех, кто делает серию пинов по одному материалу.

    '
  v: 'Пины из статьи: к каждому вопросу — своё изображение. Для хранения ручек это органайзер с ручками, для освобождения поверхности — последовательность действий, если она есть в инструкции и есть фото. Записываем вопрос, ответ и идею картинки рядом, чтобы проверить связь до оформления.

    '
23:
  b: 'Семь дней вперёд: расписание публикаций на неделю. Какой вопрос раскрываете, что уже готово, какой следующий шаг, дата шага и дата выхода. Заполняйте раз в неделю и в конце недели сравнивайте с фактом.

    '
  v: 'Как часто публиковать в Пинтерест: сначала засеките время. Сделайте пин от начала до конца и отметьте, сколько ушло на вопрос, изображение, заголовок, описание и проверку ссылки, плюс доработку исходного материала. По фактическим затратам и стройте график.

    '
24:
  b: 'Чей это пин? Четыре вопроса перед анализом: кто опубликовал, откуда изображение, вы его создали или сохранили, попал ли он в отчёт аналитики Pinterest. Помогает не путать сохранённые пины с собственными публикациями.

    '
  v: 'Сохранённые пины и собственная работа — разные задачи. В плане отмечайте действие: «сохранить найденную идею для подборки» или «подготовить пин по материалу проекта». Во втором случае ещё нужны вопрос, изображение, текст и проверка продолжения — сохранение их не заменяет.

    '
25:
  b: 'Коллаж в Пинтерест готов, если тема понятна без слов, предметы не сливаются, источники изображений записаны, а подпись не обещает лишнего. Финальная проверка перед публикацией коллажа.

    '
  v: 'Как сделать коллаж в Пинтерест: подготовка материалов. Сформулируйте тему одним предложением, подберите изображения, которые её раскрывают, и уберите случайные украшения. Берите собственные снимки или то, что разрешено использовать, и фиксируйте происхождение — сохранённый чужой пин не становится вашей фотографией.

    '
26:
  b: 'Последний фильтр перед публикацией: тема понятна, картинка видна в ленте, текст без лишних обещаний, ссылка продолжает тему. Четыре вопроса для каждой заготовки в таблице подготовки пинов.

    '
  v: 'Как вести аккаунт в пинтерест по таблице: её подготовки заполняем постепенно. У первой заготовки изображение и текст готовы, ссылку нужно проверить, статус — «В работе». После публикации статус меняется на «Опубликовано», а в таблицу вносятся дата и адрес пина.

    '
27:
  b: 'Цель → метрика в аналитике Pinterest. Мелькал ли пин — показы. Хотят вернуться — сохранения. Открыли крупно — клики по пину. Ушли на сайт — исходящие клики. Шпаргалка, чтобы выбирать показатель под задачу.

    '
  v: 'Показы в аналитике Пинтерест — это количество появлений пина на экране, а не число людей: одному человеку пин может попасться повторно. Показы также не подтверждают, что изображение рассмотрели или текст прочитали. Короткое видео о самой частой ошибке в статистике.

    '
28:
  b: 'Запись из отчёта аналитики Pinterest: дата просмотра, начало и конец периода, выбранные фильтры, показатель и его значение. Шаблон, чтобы цифра оставалась понятной через неделю и её можно было сравнить честно.

    '
  v: 'Статистика пинтерест аккаунта: для аналитики нужен бизнес-аккаунт. В меню открываем аналитику и обзор, задаём отрезок — из предложенных или вручную, для начала хватит последних тридцати дней. Записываем точные даты: при следующем просмотре границы периода уже сдвинутся.

    '
29:
  b: 'Цифры пина изменились? Возможные причины: учтены копии изображения, свежие данные предварительные, обзор обновляется иначе. Записывайте дату просмотра рядом с каждым значением. Шпаргалка для чтения статистики пина.

    '
  v: 'Статистика пина в Pinterest объединяет данные публикаций с одинаковым изображением и, когда применимо, одинаковой ссылкой, включая последующие сохранения. Поэтому число рядом с пином может учитывать несколько копий и не равно результату одной карточки на вашей доске.

    '
30:
  b: 'Запись сравнения двух пинов: наблюдение с цифрами, условия — период и фильтры, предположение с пометкой и что проверите дальше. Шаблон для честного анализа пинов без выводов на глаз.

    '
  v: 'Анализ пинов: для сравнения берём общую метрику — сохранения с кликами не смешиваем. На экране героини — пин, опубликованный 8 октября, а период отчёта начинается 13 сентября. Записываем название показателя и период — и видим, что даты не стыкуются.

    '
31:
  b: 'Разбор слабого пина в четыре шага: назовите показатель, соотнесите отчёт с днём публикации, проверьте ссылку, сравните пин и страницу. Порядок для тех, у кого пины не набирают просмотры.

    '
  v: 'Почему пины не набирают просмотры: сначала откройте пин и проверьте период отчёта и фильтры. У пина героини в карточках нули — это факт отчёта, а не причина. Сверьте период с датой публикации: недавний пин ещё не даёт судить о долгом результате.

    '
32:
  b: 'Что записать при проверке ссылки пина: устройство и браузер, адрес пина, адрес назначения, результат и текст ошибки, если она есть. Протокол помогает найти причину, когда никто не уходит по ссылке.

    '
  v: 'Адрес пина и проверка перехода: впишите лишь тот адрес, который открыли сами, и сверьте страницу с заголовком, изображением и описанием пина. Затем проверьте переход: открывается ли страница, загружается ли материал, а для товара — та ли карточка открылась.

    '
33:
  b: 'Перед кнопкой «Опубликовать»: кто создал изображение, какие условия использования, чем подтверждено обещание, куда ведёт ссылка. Четыре вопроса о правах и честности пина. Не юридическая консультация.

    '
  v: 'Авторские права в Пинтерест: указанные автор и источник фото помогают понять происхождение, но лицензию не подтверждают — ищите условия использования и сохраняйте разрешение. Заголовку нельзя обещать больше, чем видно на снимке и сайте, — никаких непроверенных цифр и гарантий.

    '
34:
  b: 'Вход в Pinterest закрыт? Возможны варианты: приостановка аккаунта, забытый пароль, защитная проверка или временное ограничение входа. Для каждого случая шаги свои, поэтому сначала разберитесь, что именно произошло.

    '
  v: 'Что делать, если Пинтерест заблокировал аккаунт: справка называет среди оснований для приостановки угрозы безопасности, спам и чужой контент. Причину вашего случая этот перечень не раскрывает, а сообщение о приостановке нельзя путать с забытым паролем или проверкой входа.

    '
35:
  b: 'Что считать результатом после пина: для статьи — прочтение, для услуги — обращение, для товара — заказ. Источник данных — ваш сайт или площадка, например маркетплейс. Шпаргалка для продавцов и блогеров.

    '
  v: 'Продажи через Пинтерест не видны по исходящим кликам: эта метрика видит только уход человека с Pinterest. Прочитали ли материал, оставили ли заявку, купили ли — по нему не узнать. Поэтому сначала решаем, какое действие нужно и какая система его посчитает.

    '
36:
  b: 'Спросите разработчика перед Rich Pins: страницы подготовлены, разметка на месте, какой тип материала — статья или товар, как проверим результат. Список вопросов, если хотите, чтобы пин показывал данные с сайта.

    '
  v: 'Rich pins в справке Pinterest — расширенные пины для статей, рецептов и товаров. Статья может подтянуть название, анонс и имя автора, карточка товара — цену и остаток. Такой вид появляется не у каждого пина: сначала проверьте требования и настройки.

    '
37:
  b: 'Проверка партнёрской публикации: связь с брендом раскрыта, программа разрешает Pinterest, учтены требования страны, никаких накруток. Чек-лист для тех, кто рассматривает заработок на пинтерест через партнёрские ссылки. Без обещаний дохода.

    '
  v: 'Pinterest affiliate: правила площадки обязывают не скрывать, что за материал или переход автору могут заплатить. Героиня проверяет условия программы: можно ли размещать ссылку в Pinterest, какие нужны обозначения и есть ли ограничения по форматам или регионам.

    '
38:
  b: 'До запуска рекламы в Pinterest выясните: доступна ли реклама там, где вы работаете, готов ли лендинг, чем будете считать результат и какую сумму готовы потратить. Реклама требует расходов.

    '
  v: 'Реклама в Пинтерест: кампании нужны цель, объявление и страница назначения, а результат зависит от настроек и доступности функции. Pinterest Tag — код на сайте для учёта действий посетителей; по справке для него нужны бизнес-аккаунт и рекламный аккаунт. Кампанию не создавали.

    '
39:
  b: 'Запланированный пин: какие поля остаются открытыми для правки. Дату — можно, тексты и доску — можно, ссылку — можно, изображение — нельзя. Поэтому картинку проверяйте до того, как ставите пин на будущую дату.

    '
  v: 'Отложенный пост Пинтерест: до постановки в очередь пин нужно вычитать целиком — отложенный выход ошибок не исправит. При создании пина выбираем публикацию позже, указываем дату и время. Порядок показан на справочном примере, в аккаунте публикация не создавалась.

    '
40:
  b: 'Описание от нейросети: контроль перед публикацией в Pinterest. Каждое утверждение найдено в исходнике, выдумки убраны, текст не расходится с изображением и сайтом. Чек-лист для описаний и заголовков, которые предложила нейросеть.

    '
  v: 'Нейросеть для Пинтерест: хороший запрос задаёт контекст и границы — «используй только сведения из статьи, предложи три заголовка, не добавляй цифры и обещания». Ответ всё равно может ошибаться: если советов пять, а машина пишет про семь, правим руками.

    '
41:
  b: 'Месяц в Pinterest на одной карточке: основа аккаунта, одна публикация целиком, повторный цикл с хронометражем, первый взгляд на отчёт. Удобно держать рядом с календарём, когда начинаете вести пинтерест с нуля.

    '
  v: 'Если параллельно идут блог и магазин, Pinterest удобно осваивать по шагам. В ролике месяц делится на отрезки: сначала порядок в настройках и подборках и только снимки с понятным авторством, затем проводим одну публикацию по официальной инструкции. Героиня вымышлена.

    '
42:
  b: 'Самопроверка Pinterest в четырёх пунктах: понятен ли профиль гостю, ведёт ли пин туда, куда обещал, известны ли права на снимки, записаны ли адрес и дата публикации. Повторяйте раз в месяц.

    '
  v: 'Проверка аккаунта пинтерест так, как её увидит новый человек: вся шапка профиля, затем пара публикаций и их продолжения. Проверяем единство снимка, подписи, подборки и описания для незрячих. Финальный урок курса, персонаж выдуман.

    '
