    Седьмое видео бесплатного цикла BoostKlient. Создаём первую тематическую доску и решаем, что в неё складывать.

    Пошагово:
    • две темы учебного проекта — рабочее место и хранение в маленькой комнате;
    • почему название «Красивое» хуже, чем название с понятной темой;
    • создание доски и выбор: открытая или секретная;
