        Сохранение добавляет идею в вашу подборку. Своя публикация — это когда вы загружаете своё фото. Это два разных действия.
      hashtags: [pinterest, shorts, авторство]
      hook: "Сохранили — не значит создали"
      cover: "Чьё это фото?"

