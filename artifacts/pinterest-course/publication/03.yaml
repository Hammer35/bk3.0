youtube:
  titles:
    - "Пин, доска и профиль: как устроен Pinterest — урок 3"
    - "Создать пин или сохранить чужой? Главное различие Pinterest для новичка"
    - "Сохранили чужую фотографию — стали автором? Разбираем на примере"
  thumbs:
    - "Пин. Доска. Профиль."
    - "Создать или сохранить?"
    - "Где я сейчас?"
  description: |
    Третье занятие для новичков. Раскладываем по полочкам три сущности, которые путают чаще всего.

    Разбираем:
    • пин — отдельная публикация с картинкой или роликом и подписью;
    • доска — подборка пинов одной темы;
    • профиль — страница аккаунта с именем, фото, описанием и досками;
    • разница между созданием своего пина и сохранением чужого: сохранение не делает вас автором фотографии;
    • упражнение «где я нахожусь»: профиль → доска → пин.

    Анна сочинена авторами, как и всё её «хозяйство». Интерфейс показан в живом учебном аккаунте, названия кнопок на разных устройствах могут отличаться.

    Задание: назовите будущую доску, опишите один пин для неё и объясните, что их связывает.

    Справка Pinterest: https://help.pinterest.com/en/guide/guide-to-creating-pins
