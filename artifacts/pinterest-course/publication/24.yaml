  description: |
    Двадцать четвёртое занятие. Уточняем, какую работу вы записываете в план, — создаёте новую публикацию или сохраняете найденную идею, — и чем это аукается при анализе.

    Разбираем:
    • что справка относит к опубликованному (включая материалы с подтверждённого домена);
    • сохранённый — пины, добавленные из Pinterest или с чужих сайтов;
    • подборка понравившихся идей не равна собственным публикациям, а чужое фото не становится вашим;
    • как помечать в плане тип работы;
    • какие данные попадают в обзор и где переключатель для сохранённых.

    Анна — вымышленная героиня; для задания достаточно просмотра, новые публикации не нужны.

    Задание: выберите пару публикаций в профиле и опишите, откуда они, что вы с ними сделали и зачем.

    Справка об аналитике: https://help.pinterest.com/en/business/article/pinterest-analytics
