  description: |
    Пятнадцатое видео. Заметили ошибку в уже вышедшей публикации — разбираемся, что можно поправить в редакторе, а что требует нового пина.

    По шагам:
    • определяем, где ошибка: заголовок, описание, ссылка или само изображение;
    • текстовая ошибка — откройте пин через профиль и выберите правку в меню;
    • набор полей определяется способом создания публикации;
    • неверная ссылка — меняем адрес только после проверки нового;
    • опечатка прямо на изображении — его не заменить, нужен свежий макет и новый пин;
    • удаление — только осознанно: удалённый пин не восстановить.

    Анна и её пин — учебные, сама героиня выдумана. Порядок редактирования показан для ваших собственных публикаций.

    Задание: проверьте свою публикацию, при необходимости поправьте и запишите в таблицу, что и когда изменили.
