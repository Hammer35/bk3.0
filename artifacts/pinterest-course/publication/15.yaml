youtube:
  titles:
    - "Как отредактировать опубликованный пин в Pinterest и что изменить нельзя — урок 15"
    - "Опечатка в пине: правим текст, адрес или выпускаем заново"
    - "Ошибка на картинке пина? Редактирование не поможет. Что делать"
  thumbs:
    - "Правим пин"
    - "Где ошибка?"
