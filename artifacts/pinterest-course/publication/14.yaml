  titles:
    - "Публикуем первый пин в Pinterest: от картинки до кнопки — урок 14"
    - "Первый пин без ошибок: изображение, тексты, alt, ссылка, доска"
    - "Не придумывайте ссылку ради галочки. Публикуем пин честно"
  thumbs:
    - "Первый пин"
    - "6 полей — 0 ошибок"
    - "Ссылку не выдумываем"
  description: |
    Четырнадцатое занятие. Собираем всё подготовленное — картинку, заголовок, описание, альтернативный текст и проверенный адрес — и проходим публикацию.

    Шаги в ролике:
    • открываем форму на компьютере, загружаем фото или продолжаем черновик;
    • название и пояснение — сверяем их с картинкой;
    • проверка alt в дополнительных параметрах — он не заменяет описание;
    • поле ссылки: только настоящий адрес страницы, которую вы сами открыли;
    • выбор тематической доски и финальная сверка;
    • что проверить сразу после выхода и что записать в таблицу.

    Статья Анны в нашей истории не написана, поэтому её учебный пин остаётся черновиком — подставлять выдуманную ссылку мы не стали. Анна — персонаж; интерфейс подлинный.

    Задание: выпустите свой готовый пин, откройте его, кликните по ссылке и занесите в таблицу его URL и число.

    Гид Pinterest по созданию пинов: https://help.pinterest.com/en/guide/guide-to-creating-pins
