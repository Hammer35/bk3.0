youtube:
  titles:
    - "Показы, сохранения и клики в Pinterest: смысл каждой метрики — урок 27"
    - "Исходящие клики Pinterest: единственная метрика переходов на сайт"
    - "1000 показов — это не 1000 человек. Разбираем аналитику Pinterest"
  thumbs:
    - "3 метрики"
    - "Исходящие клики"
    - "Показ ≠ человек"
  description: |
    Двадцать седьмое занятие открывает блок аналитики. Связываем каждое число с действием человека и выбираем показатель под задачу.

    Разбираем:
    • показы — сколько раз пин появлялся на экране; не число людей и не доказательство, что его рассмотрели;
    • сохранения — пин добавлен на доску; о переходах на сайт ничего не говорят;
    • клик по пину — человек раскрыл публикацию;
    • исходящий клик — переход по прикреплённой ссылке; для цели «привести на сайт» смотрим именно его;
    • действия не обязаны идти цепочкой: кто-то сохраняет без перехода, кто-то переходит без сохранения;
    • сравниваем при одинаковых условиях, с учётом периода отчёта (например, последние 30 дней).

    Экраны аналитики — из учебного аккаунта; героиня придумана.

    Задание: откройте статистику одного-двух пинов, найдите три показателя и сформулируйте, какое действие стоит за каждым. Без выводов.

    Справка Pinterest Analytics: https://help.pinterest.com/en/business/article/pinterest-analytics
