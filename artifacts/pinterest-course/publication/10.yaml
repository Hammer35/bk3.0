    • что Pinterest советует про совпадение визуала с сайтом;
    • короткая заметка-план перед оформлением.

    Анна — сочинённая героиня, статья её тоже условная. Интерфейс — подлинный.

    Задание: набросайте собственный план публикации. Одно предложение не вмещает тему — уменьшайте охват.

    Справка Pinterest о качестве пинов: https://help.pinterest.com/en/business/article/pin-performance-and-distribution
