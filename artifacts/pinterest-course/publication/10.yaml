    Десятое занятие открывает модуль о первом пине. Начинаем не с дизайна, а с выбора одной задачи, которую публикация решит.

    Что в видео:
    • правило «одна публикация — одна понятная задача»;
    • статья с пятью идеями, но в пин выносим одну — как разместить канцелярию на небольшом столе;
