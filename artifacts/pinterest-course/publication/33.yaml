        На пине стоит подпись «Фото: такой-то автор, такой-то сайт». Значит, всё легально?

        Нет. Подпись говорит, откуда снимок. А разрешение на использование — это условия лицензии, которые нужно найти и сохранить.

        По одному экрану лицензию не подтвердить. Пример из нашего курса, героиня выдумана.
