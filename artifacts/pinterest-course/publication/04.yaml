threads:
  topic: "Pinterest"
  card: "Обещали пять идей, а открыли главную"
  posts:
    - |
      Самая дорогая ошибка в Pinterest стоит ноль рублей: ссылка не туда.

      Пин про советы ведёт на главную магазина. Человек кликнул, не нашёл обещанного и ушёл. #Pinterest
    - |
      Правило простое: куда зовёт картинка, туда и должна вести кнопка. Советы — к статье, вещь — к её странице, услуга — к её описанию.

      И потыкайте в адрес на телефоне до выхода пина.
    - |
      Об этом рассказывает четвёртое видео. Анна, на которой мы показываем, выдумана, а Pinterest на экране — настоящий.

      Куда сейчас ведут ваши пины?

