rutube:
  titles:
    - "Урок 4. Связь Pinterest с сайтом и выбор страницы для ссылки"
    - "Как настроить переход из Pinterest на сайт, блог или карточку товара"
  covers:
    - "Связь с сайтом"
    - "Клик ведёт дальше"
  description: |
    Четвёртое занятие. Тема: связь публикаций Pinterest с внешним сайтом.

    Разбираемые вопросы:
    1. Публикация как отправная точка к внешнему материалу.
    2. Выбор страницы назначения исходя из содержания пина.
    3. Статья блога как продолжение пина-подборки.
    4. Страница конкретного предмета для пина о нём; проверка выбранного варианта.
    5. Согласованность изображения, заголовка и страницы.
    6. Техническая проверка: загрузка страницы на мобильном устройстве.

    Героиня примера условная. Число переходов в уроке не прогнозируется; переход не является покупкой.

    Источник: https://help.pinterest.com/en/guide/guide-to-creating-pins
