      cover: "Тест ссылки"

vk_video:
  titles:
    - "Pinterest и ваш сайт: какую страницу ставить в ссылку, чтобы человек не ушёл"
    - "Почему люди уходят с сайта после клика по пину"
  covers:
    - "Пин → нужная страница"
    - "Кликнули и ушли. Почему?"
  description: |
    Четвёртое видео цикла. Человек нажал на пин — и что дальше? Разбираем, как выбрать страницу назначения: статья, карточка товара, описание услуги. И как проверить, что она действительно продолжает картинку.

    Анны не существует, мы придумали её для примеров. Экраны — из настоящего Pinterest.

    После просмотра: сформулируйте в двух строках, что будет на картинке и что откроется после нажатия.
  hashtags: [pinterest, пинтерест, сайт]
  post: |
    Представьте: на пине написано «пять идей для маленького стола». Вы жмёте — а открывается главная страница магазина. Будете искать эти идеи? Скорее закроете вкладку.

    Четвёртый урок о том, как не терять людей на этом шаге. Расскажите, куда ведут ваши пины — на главную или на конкретную страницу?
