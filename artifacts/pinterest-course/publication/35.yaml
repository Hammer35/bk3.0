youtube:
  titles:
    - "Переход из Pinterest и продажа: как измерить действие после клика — урок 35"
    - "Исходящий клик — не заказ. Метрики после ухода с платформы"
    - "Человек перешёл по пину. Прочитал? Купил? Pinterest этого не знает"
  thumbs:
    - "Клик → действие"
    - "Клик ≠ покупка"
    - "Что после перехода"
  description: |
    Тридцать пятое занятие. Посетитель кликнул и покинул Pinterest. Чем всё закончилось — знают другие системы.

    Внутри:
    • исходящие клики в аналитике Pinterest показывают переходы за пределы платформы — и только;
    • сначала цель: чтение для статьи, обращение для услуги, знакомство или заказ для товара;
    • проходим маршрут глазами посетителя;
    • учёт на своём ресурсе обсуждаем с его администратором;
    • для маркетплейса сначала изучаем его отчёты и определения; связь заказа с переходом нужно отдельно подтвердить;
    • источники держим порознь и разбираемся в методиках подсчёта.

    Героиня — плод фантазии.

    Задание: запишите желаемое действие и место, где оно будет учитываться.

    Справка Pinterest Analytics: https://help.pinterest.com/en/business/article/pinterest-analytics
