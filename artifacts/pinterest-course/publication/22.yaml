  description: |
    Двадцать вторая серия. Берём один объёмный текст и ищем в нём отдельные полезные темы: читаем целиком, выписываем вопросы с конкретными ответами, придумываем картинку к каждому. И отсекаем «новые» пины, которые отличаются только цветом или словом «очень».

    Героиня курса выдумана, её руководство пока в планах.

