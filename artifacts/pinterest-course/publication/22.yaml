youtube:
  titles:
    - "Пины Pinterest из одной статьи: выделяем самостоятельные идеи — урок 22"
    - "Одна статья — сколько пинов? Считаем смыслы, не оттенки"
    - "Сменили цвет фона — получили новый пин? Нет. Разбор"
  thumbs:
    - "1 статья → N пинов"
    - "Считаем вопросы"
    - "Новый фон ≠ новый пин"
  description: |
    Двадцать второе занятие. Разбираем, как из одного содержательного материала выделить несколько самостоятельных идей — и не наплодить копий.

    По шагам:
    • число будущих пинов не планируем заранее;
    • читаем от начала до конца, отмечая абзацы с ответами;
    • для каждого вопроса — идея изображения;
    • сравнение вариантов без картинок: разные задачи против одинаковых по сути заголовков;
    • почему перекраска не создаёт новую тему и что говорит платформа о повторах;
    • ссылку проверяем для каждого варианта отдельно.

    Инструкция Анны в примере — возможный план, а не готовая статья; сама героиня вымышлена.

    Задание: выпишите самостоятельные вопросы одного материала, к каждому — фрагмент с ответом, идею картинки и продолжение. Уберите смысловые повторы.

    Как Pinterest распространяет пины: https://help.pinterest.com/en/business/article/pin-performance-and-distribution
  hashtags: [Pinterest, ИдеиДляПинов, КурсPinterest]
  tags: [несколько пинов из одной статьи, переработка контента pinterest, идеи для пинов, дубли пинов, уникальный контент pinterest, контент план, pinterest для бизнеса, pinterest для начинающих]
  comment: |
    Возьмите свою самую объёмную статью: сколько в ней самостоятельных вопросов? Напишите число и пару примеров.
  shorts:
    - title: "Перекрасили фон пина — это не новая идея"
      description: |
        Тот же смысл в другом цвете — копия, а не новый пин. Площадка против дублей.
      hashtags: [pinterest, shorts, контент]
      hook: "Другой цвет — та же мысль"
      cover: "Это копия"
    - title: "Сколько пинов выйдет из статьи? Посчитайте вопросы"
      description: |
        Не ставьте план «десять пинов». Прочитайте материал и выпишите, на какие вопросы в нём реально есть ответ.
      hashtags: [pinterest, shorts, идеи]
      hook: "Не задавайте число заранее"
      cover: "Вопросы, не число"

