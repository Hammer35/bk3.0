rutube:
  titles:
    - "Урок 22. Несколько идей для пинов из одного материала"
    - "Выделение самостоятельных тем из статьи для публикаций Pinterest"
  covers:
    - "Идеи из одного материала"
    - "Самостоятельные темы"
  description: |
    Двадцать второе занятие.

    Рассматриваются:
    1. Отказ от заранее заданного количества публикаций.
    2. Анализ материала и фиксация фрагментов с ответами.
    3. Подбор идеи изображения для каждого вопроса.
    4. Критерий самостоятельности: различие задач, а не формулировок или оформления.
    5. Позиция платформы по дублированию.
    6. Отдельная проверка продолжения для каждого варианта.

    Учебная инструкция героини является планом; персонаж вымышлен.

    Справка: https://help.pinterest.com/en/business/article/pin-performance-and-distribution
