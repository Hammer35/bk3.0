  description: |
    Двадцать первая серия. Смотрим на свои фото, тексты и страницы и превращаем их в рабочий список для будущих публикаций. Для каждой строки — вопрос, который материал раскрывает, идея картинки, продолжение по ссылке и статус готовности.

    Важно: «готовым» считается лишь просмотренное своими глазами. Персонаж Анна придуман; пример учебный.

    Задание: небольшая таблица по своим материалам с отметками статуса.
