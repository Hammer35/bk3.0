    Когда кажется, что для Pinterest «ничего нет», обычно есть: фото товаров, старые статьи, примеры работ. Их просто никто не собрал в одно место.

    А когда кажется, что «всё есть», часто половина — только в планах.

    В 21-м уроке делаем честную ревизию. У вас скорее первое или второе?
