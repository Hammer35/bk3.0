youtube:
  titles:
    - "Запас материалов для пинов Pinterest: сбор и проверка — урок 21"
    - "Ревизия контента: таблица на четыре графы"
    - "Идея ≠ готовый материал. План без воздушных замков"
  thumbs:
    - "Запас для пинов"
    - "Есть или нет?"
    - "Идея — не материал"
  description: |
    Двадцать первое видео. Прежде чем оформлять новые пины, собираем то, что уже можно использовать, и честно отмечаем, чего не хватает.

    Внутри:
    • идея ещё не означает готовый материал — открываем файл или страницу и смотрим, что там есть;
    • несуществующую статью в готовое не записываем;
    • для каждого материала — один понятный вопрос человека;
    • рабочая таблица с четырьмя колонками;
    • технический и смысловой осмотр каждого пункта;
    • состояние подготовки и конкретный следующий шаг вместо «заняться статьёй».

    Анна — вымышленная героиня; её список учебный.

    Задание: составьте небольшой список материалов, заполните четыре графы и отметьте готовность. Стартуйте с доступного под рукой.

    Гид по созданию пинов: https://help.pinterest.com/en/guide/guide-to-creating-pins
  hashtags: [Pinterest, КонтентПлан, КурсPinterest]
  tags: [контент план pinterest, материалы для пинов, планирование контента, идеи для pinterest, таблица контента, pinterest для бизнеса, pinterest для начинающих, подготовка публикаций]
  comment: |
    Сколько готовых материалов для пинов у вас нашлось, если честно? Пишите — подскажем, с чего начать.
  shorts:
    - title: "Записали статью в «готово», а её ещё нет?"
      description: |
        Задумка — не ресурс. Помечайте «готово» лишь то, что лежит на диске или на сайте.
      hashtags: [pinterest, shorts, план]
      hook: "Её ещё нет"
      cover: "Только то, что есть"
    - title: "«Заняться статьёй» — плохая задача. Вот хорошая"
      description: |
        Вместо расплывчатого «доделать» пишите конкретно: какой абзац дописать, какое фото проверить.
      hashtags: [pinterest, shorts, задачи]
      hook: "Расплывчато — значит никогда"
      cover: "Конкретный шаг"

