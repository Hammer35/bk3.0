  description: |
    Двадцать девятое занятие. Открываем подробную статистику одного пина и разбираемся, к каким публикациям могут относиться показанные числа.

    Шаги и особенности:
    • где открыть детальный отчёт публикации;
    • вопрос, который определяет нужный показатель;
    • даты, фильтры, пояснения к метрике и дословная запись результата;
    • объединение данных по одной и той же картинке — откуда в цифре «чужие» действия;
    • почему свежие значения иногда снижаются;
    • статистика пина и общий обзор могут расходиться — это ещё не объясняет, что произошло;
    • отдельно проверяем сам пин: картинка, заголовок, ссылка.

    Учебный аккаунт, героиня выдумана.

    Задание: адрес пина, дата просмотра, период, фильтры, показатель, результат и короткое наблюдение — без объяснения причин.

    Справка о статистике пина: https://help.pinterest.com/en/business/article/pin-stats
