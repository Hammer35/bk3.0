    Занятие 6. Тема — оформление профиля бизнес-аккаунта.

    Разбираемые вопросы:
    1. Какое имя выбрать для профиля автора или бренда.
    2. Требования к изображению профиля: узнаваемость в уменьшенном виде.
    3. Структура короткого описания: род занятий и тип публикуемых материалов.
