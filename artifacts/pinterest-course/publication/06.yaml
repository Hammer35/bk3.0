threads:
  topic: "Pinterest"
  card: "Друг открыл ваш профиль. Что он о вас скажет?"
  posts:
    - |
      Простой тест для профиля в Pinterest: покажите его кому-нибудь на 5 секунд и спросите, чем вы занимаетесь.

      Если человек мнётся — дело не в нём, а в шапке. #Pinterest
    - |
      Что обычно мешает:
      — имя без темы («Анна» вместо «Анна — Порядок дома»);
      — аватар, который в маленьком кружке превращается в пятно;
      — описание «люблю красивое»;
      — сайт, который не открывается с телефона.
    - |
      В шестом уроке курса BoostKlient заполняем всё это на учебном аккаунте. Анна у нас вымышленная, экраны — живые.

      А вы как подписали свой профиль? Киньте в ответы, посмотрим.

