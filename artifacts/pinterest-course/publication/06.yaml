youtube:
  titles:
    - "Как оформить профиль Pinterest: имя, аватар, описание и сайт — урок 6"
    - "Профиль Pinterest, который понятен с первого взгляда. Разбор на живом аккаунте"
    - "Почему посетитель уходит из вашего профиля Pinterest и что поправить за 15 минут"
  thumbs:
    - "Профиль без загадок"
    - "Кто вы? Ответ за 3 секунды"
    - "4 поля, которые читают первыми"
  description: |
    Оформляем бизнес-профиль Pinterest так, чтобы человек с первого экрана понял, кто автор и что он публикует. Урок 6 из бесплатного цикла.

    В видео:
    • имя профиля, которое связывает автора с темой проекта;
    • аватар: портрет или знак бренда, различимый даже крошечным;
    • описание из двух ответов — чем вы занимаетесь и какие материалы здесь лежат;
    • адрес сайта и проверка страницы с телефона;
    • где в настройках Pinterest редактировать эти поля.

    Пример — тренировочный аккаунт Анны. Сама Анна, её магазин и блог — выдумка, а экраны Pinterest настоящие.

    Домашняя работа: заполните четыре поля своего профиля и попросите знакомого пересказать, о чём он. Если пересказ расходится с задумкой — правьте формулировки.

    Мы не обещаем охват, подписчиков или продажи: урок про понятность профиля, а не про алгоритм.

    Справка Pinterest по редактированию профиля: https://help.pinterest.com/en/article/edit-your-profile
    Предыдущий урок — выбор между личным и бизнес-аккаунтом. Следующий — тематические доски.
