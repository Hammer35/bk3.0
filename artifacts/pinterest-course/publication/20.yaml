    - "Один всплеск на графике — ещё не сезон. Проверяем по двум годам"
  thumbs:
    - "Сезон и прогноз"
    - "Три разные записи"
    - "Всплеск ≠ сезон"
  description: |
    Двадцатое занятие. Используем записи о графиках для подготовки материалов и учимся разделять три вещи: что уже видно в данных, что Pinterest прогнозирует и что решаете вы сами.

    В видео:
    • что называем сезонностью;
    • сравнение похожих месяцев за два года в Pinterest Trends: один подъём ещё не доказывает ежегодное повторение;
    • расписание подготовки с отдельным сроком под каждый этап;
    • годовой отчёт Pinterest Predicts и проверка, к какому году он относится;
    • прогноз не устанавливает будущие клики или продажи вашего аккаунта;
    • идея из отчёта берётся, только если подходит вашим материалам.

    Пример — подготовка рабочего стола к учебному году у выдуманной героини. Мы не утверждаем, что пик интереса приходится на этот период.

    Задание: три отдельные записи — наблюдение, идея из прогноза, ваше решение. Укажите источники, регион, год отчёта и дату.

    Pinterest Predicts: https://business.pinterest.com/en-ca/pinterest-predicts/
