  description: |
    Тридцать четвёртое занятие. Учебная ситуация: героиня пытается войти и видит уведомление о приостановке аккаунта. Разбираем порядок действий.

    По шагам:
    • читаем уведомление целиком и сохраняем точную формулировку;
    • Pinterest может приостановить аккаунт за нарушения правил сообщества — среди оснований безопасность, спам, права на контент; этот перечень не объясняет конкретный случай;
    • не каждый отказ во входе — приостановка, и шаги отличаются;
    • записываем: какой аккаунт, когда появилось уведомление, что в нём сказано; причина не названа — так и отмечаем;
    • как жаловаться официально и почему нет гарантий;
    • для вопросов о правах на материалы у Pinterest отдельный порядок;
    • переписку храним, паспортные данные не рассылаем, «волшебникам» не верим.

    Ситуация учебная, героиня придумана.

    Справка о приостановке: https://help.pinterest.com/en/article/account-suspension
