title: Сравнение публикаций

youtube:
  titles:
    - "Сравнение пинов в Pinterest: показатель, период, наблюдение — урок 30"
    - "Наблюдение или догадка? Учимся сравнивать публикации честно"
    - "Период отчёта начинается до публикации пина. Ошибка, которую не видят"
  thumbs:
    - "Пин vs пин"
    - "Факт или догадка"
    - "Период раньше пина"
  description: |
    Тридцатое занятие. Сравнение публикаций помогает понять разницу в результатах, но сначала нужно решить, на какой вопрос отвечаем.

    Разбираем:
    • один и тот же показатель для обоих пинов; сохранения не подменяем кликами;
    • реальный экран героини с нулями и датами, которые не стыкуются;
    • почему отрезок отчёта должен стартовать после выхода и быть равным для обоих;
    • показы как «возможность получить действие»: при большой разнице сравнивать итоговые сохранения мало;
    • «у первого больше сохранений» — наблюдение; «людям больше понравилась тема» — предположение.

    Экраны реальные, героиня — сочинённая. Объяснения нулей в уроке нет — и это честно.

    Задание: сравните две свои публикации по одному показателю и запишите ссылки, даты выхода, период, фильтры, значения и что хотите проверить дальше.

    Справка: https://help.pinterest.com/en/business/article/pinterest-analytics
  hashtags: [АналитикаPinterest, Pinterest, КурсPinterest]
  tags: [сравнение пинов, анализ публикаций pinterest, аналитика pinterest, a/b тест pinterest, период отчета, показатели пина, pinterest для бизнеса, гипотезы]
  comment: |
    Есть два пина, которые хочется сравнить? Напишите их даты выхода — подскажем, какой период взять.
  shorts:
    - title: "Публикация моложе, чем отрезок отчёта"
      description: |
        Значит, часть отрезка приходится на время до выхода. Для сравнения берите отрезок после публикации.
      hashtags: [pinterest, shorts, аналитика]
      hook: "Даты не стыкуются"
      cover: "Неверный период"
    - title: "Наблюдение и предположение — запишите отдельно"
      description: |
        «Больше сохранений» — факт за период. «Тема понравилась больше» — догадка. Не смешивайте их в одну строку.
      hashtags: [pinterest, shorts, гипотезы]
      hook: "Факт ≠ догадка"
      cover: "Две колонки"

