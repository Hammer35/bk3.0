version: 1
indexed_in_rag: false
cases:
- id: ae-001
  family: analytics_explanation
  business_profile: known
  knowledge_mode: unavailable
  messages:
  - 'Показы за месяц удвоились: со 16000 до 32000, а переходы на товары не изменились
    — 480. Коротко: это хорошо или плохо и что проверить в первую очередь?'
  expected:
  - 'Точное сравнение в долях: доля переходов до ~3.0% и после ~1.5%, т.е. вдвое ниже,
    а не просто ''показы выросли''.'
  - 'Не объявляет это безусловно плохим результатом и не выводит ухудшение качества
    контента или аудитории из доли: причина не установлена.'
  - Один конкретный следующий шаг (например, сравнить обложки и типы контента двух
    периодов), а не общая лекция.
- id: ae-002
  family: analytics_explanation
  business_profile: known
  knowledge_mode: unavailable
  messages:
  - За неделю было 12 переходов на товары и ни одного заказа. Значит, переходы бесполезны?
    Коротко, и назови один следующий шаг.
  expected:
  - 'Не приравнивает переход к заказу: между ними цена, наличие, отзывы и корзина,
    что выходит за пределы предоставленных цифр.'
  - Отмечает, что 12 переходов — слишком малая выборка, чтобы судить о конверсии в
    заказ.
  - Один следующий шаг, например проверить соответствие конкретной карточки обещанию
    публикации; не придумывает сведения о цене, наличии и отзывах.
- id: ae-003
  family: analytics_explanation
  business_profile: known
  knowledge_mode: unavailable
  messages:
  - За последние 7 дней было 500 показов, а за 30 дней — 1800. Делаю вывод, что трафик
    падает. Проверь коротко и дай один шаг.
  expected:
  - 'Замечает разные длительности и перекрытие окон 7/30 дней. Среднее за день
    допустимо как арифметика, но не доказывает тренд или его значимость.'
  - Не подтверждает вывод 'трафик падает' по сырым числам 500 и 1800 без нормализации.
  - 'Один шаг: сравнить одинаковые окна, например, последние 7 дней с предыдущими
    7 днями.'
- id: ae-004
  family: analytics_explanation
  business_profile: known
  knowledge_mode: unavailable
  messages:
  - У варианта А 3 перехода, у варианта Б 1. Получается, А втрое лучше? Ответь коротко
    и дай один следующий шаг.
  expected:
  - 'Три перехода против одного не доказывают превосходство: неизвестны показы и условия,
    выборка мала.'
  - Не объявляет вариант А втрое эффективнее и не утверждает вычисленную статистическую
    значимость.
  - 'Один шаг: сравнить долю переходов при сопоставимых показах, периоде и аудитории;
    не требует уравнять число переходов как результат.'
- id: ae-005
  family: analytics_explanation
  business_profile: known
  knowledge_mode: unavailable
  messages:
  - 'Переходы упали с 90 до 40 за месяц. Вижу причину: стал реже публиковать. Так
    и есть? Коротко и один следующий шаг.'
  expected:
  - Снижение частоты публикаций называет гипотезой, а не подтверждённой причиной;
    причину не подтверждает без проверки других факторов.
  - Не обещает, что возврат к старому темпу гарантированно вернёт 90 переходов.
  - 'Один проверяемый шаг: сопоставить публикации и переходы за равные завершённые
    периоды; не навязывает произвольный срок как правило.'
- id: ae-006
  family: analytics_explanation
  business_profile: known
  knowledge_mode: unavailable
  messages:
  - 'За неделю выложил 10 почти одинаковых публикаций с новым товаром и не понимаю,
    что сработало. Коротко: что я делаю не так и один следующий шаг.'
  expected:
  - Указывает, что 10 почти одинаковых публикаций не отделяют ни одно изменение —
    непонятно, какой фактор повлиял.
  - 'Не обещает рост от количества дублей и не приписывает алгоритму снижение
    охвата без источника; по этим данным причина неизвестна.'
  - 'Один шаг: менять по одному фактору за раз (например, только обложку) и сравнивать
    переходы в равных периодах.'
